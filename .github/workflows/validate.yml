name: Validate Claw Quest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate game and PWA files
        run: node scripts/validate.mjs
