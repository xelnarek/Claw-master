<title>Claw Quest — Arcade Roguelite</title>
<style>
:root{color-scheme:dark;--ink:#fff8eb;--muted:#aebbd5;--panel:#172541;--line:rgba(255,255,255,.16);--gold:#ffd166;--cyan:#67e8e5;--navy:#101a34;--blue:#29466f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091326;font-family:Inter,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:block;background:#091326}
/* Pełnoekranowy układ mobilny: żadnych pustych pasów nad/pod grą na ekranach 19.5:9–21:9. */
#game-wrap{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;overflow:hidden;border-radius:0;background:#101b35;box-shadow:none;isolation:isolate}
canvas{display:block;width:100%;height:100%;touch-action:none}
@supports(height:100svh){#game-wrap{height:100svh}}
@media(min-width:700px) and (min-height:900px){#game-wrap{width:min(100vw,62.5dvh);height:min(100dvh,160vw);left:50%;top:50%;transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 24px 90px #000b,0 0 0 1px #ffffff24}}
#toast{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) scale(.95);opacity:0;pointer-events:none;padding:11px 17px;border:1px solid #ffffff35;border-radius:16px;background:#111c33ee;color:white;font-size:13px;font-weight:900;letter-spacing:.05em;white-space:nowrap;box-shadow:0 12px 32px #0008;transition:.18s}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#hint{position:absolute;bottom:7px;left:0;right:0;text-align:center;color:#c9d4ef88;font-size:9px;letter-spacing:.08em;pointer-events:none}
@media(max-height:520px){#hint{font-size:8px;bottom:2px}}
</style>
</head>
<body>
<main id="game-wrap" aria-label="Claw Master Arcade Quest">
<canvas id="game" width="450" height="800" aria-label="Gra Claw Master Arcade Quest"></canvas>
<div id="toast" role="status"></div>
<div id="hint">TUROWA WALKA • J ATAK • K OBRONA • L SUPER • CHWYTAK NA DOLE</div>
</main>
<script>
(() => {

const state={

const PROFILE_KEY="clawQuestProfileV1";

 {title:"Zarośnięta Ścieżka",biome:"forest",objective:"Uważaj na szybkie nietoperze.",waves:[["slime","slime"],["slime","bat"]],coins:28,xp:26},

 {title:"Ruiny Strażników",biome:"ruins",objective:"Gobliny i kolczaste bestie blokują przejście.",waves:[["goblin","goblin","bat"],["porcupine","goblin","slime"]],coins:50,xp:42},

];
const starterProfile=()=>({coins:0,xp:0,level:1,attackRank:0,vitalityRank:0,clawRank:0,unlockedStage:1,bestStage:1,bestScore:0});
function loadProfile(){try{const raw=localStorage.getItem(PROFILE_KEY);if(!raw)return starterProfile();const data=JSON.parse(raw),base=starterProfile();for(const key of Object.keys(base)){const value=Number(data?.[key]);base[key]=Number.isFinite(value)?Math.max(0,Math.floor(value)):base[key]}base.level=Math.max(1,base.level);base.unlockedStage=Math.max(1,Math.min(99,base.unlockedStage));return base}catch(e){return starterProfile()}}

function saveProfile(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));return true}catch(e){return false}}

function gainCoins(amount){const n=Math.max(0,Math.floor(amount));profile.coins+=n;state.coins=profile.coins;saveProfile();return n}
const abilityPool=[
 {id:"edge",name:"Ostrze runiczne",tag:"ATAK",desc:"+2 do obrażeń każdego ataku",color:"#ffb65c",max:4},
 {id:"vital",name:"Serce olbrzyma",tag:"ŻYWOTNOŚĆ",desc:"+20 maks. HP i natychmiastowe leczenie",color:"#ff7798",max:4},
 {id:"bulwark",name:"Aegis",tag:"OBRONA",desc:"+18 punktów tarczy",color:"#71dfff",max:4},
 {id:"execution",name:"Precyzyjne cięcie",tag:"KRYTYK",desc:"+8% szansy na podwójne obrażenia",color:"#f6db7b",max:5},
 {id:"reaper",name:"Głód łowcy",tag:"REGENERACJA",desc:"Odzyskaj 3 HP za pokonanego wroga",color:"#8de6a8",max:4},
 {id:"storm",name:"Burza eteru",tag:"SUPER",desc:"+4 obrażenia superataku",color:"#b69aff",max:4},

];
function rollAbilityChoices(){const available=abilityPool.filter(a=>(state.runSkills[a.id]||0)<a.max),pool=[...available],choices=[];while(pool.length&&choices.length<3){const i=Math.floor(Math.random()*pool.length);choices.push(pool.splice(i,1)[0])}if(!choices.length){state.pendingLevelUps=0;state.levelChoices=null;notify("WSZYSTKIE UMIEJĘTNOŚCI MAKSYMALNE");return}state.levelChoices=choices;state.turnTimer=0;beep(740,.14,"sine",.045);notify("AWANS! WYBIERZ JEDNĄ UMIEJĘTNOŚĆ")}
function chooseAbility(index){if(!state.levelChoices||!state.levelChoices[index])return false;const a=state.levelChoices[index];state.runSkills[a.id]=(state.runSkills[a.id]||0)+1;
 if(a.id==="edge")state.runDamageBonus+=2;if(a.id==="vital"){state.maxHp+=20;state.hp=Math.min(state.maxHp,state.hp+20)}if(a.id==="bulwark")state.shield+=18;if(a.id==="execution")state.runCrit+=.08;if(a.id==="reaper")state.runHealOnKill+=3;if(a.id==="storm")state.runSkillBonus+=4;if(a.id==="claw")state.runClawBonus+=12;if(a.id==="fortune")state.runLootBonus+=.5;if(a.id==="venom")state.runVenom+=2;
 state.damage=effectiveDamage();state.pendingLevelUps=Math.max(0,state.pendingLevelUps-1);state.levelChoices=null;beep(980,.1,"triangle",.05);if(state.pendingLevelUps>0)rollAbilityChoices();else notify(a.name.toUpperCase()+" • WYBRANO");return true}
function gainXp(amount){profile.xp+=Math.max(0,Math.floor(amount));let levels=0;while(profile.xp>=profile.level*30){profile.xp-=profile.level*30;profile.level++;levels++}if(levels){state.pendingLevelUps+=levels;rollAbilityChoices()}saveProfile();return levels}

function spawnStageWave(){const def=stageDefinition();if(state.stageWave>=def.waves.length){completeStage();return}const types=def.waves[state.stageWave++];state.wave=state.stageWave;state.enemies=[];state.selectedEnemy=0;state.threatEnemy=null;for(const type of types)spawnEnemy(type);notify("ETAP "+state.stage+" • FALA "+state.wave)}

function advanceStage(){if(!state.stageCleared)return false;state.stage++;state.stageWave=0;state.stageCleared=false;state.stageReward=0;state.stageXp=0;state.enemies=[];state.selectedEnemy=0;state.turn="player";state.turnTimer=0;state.defending=false;state.damage=effectiveDamage();state.maxHp=effectiveMaxHp();state.hp=Math.min(state.maxHp,state.hp);spawnStageWave();return true}
function startRun(stage=profile.unlockedStage){state.started=true;state.paused=false;state.over=false;state.screen="game";state.time=0;state.spawn=0;state.shot=0;state.turn="player";state.turnTimer=0;state.defending=false;state.selectedEnemy=0;state.playerAction="idle";state.playerActionTimer=0;state.skillReady=true;state.skillCooldown=0;state.stage=Math.max(1,Math.min(profile.unlockedStage,Math.floor(stage)||1));state.stageWave=0;state.stageCleared=false;state.stageReward=0;state.stageXp=0;state.runDamageBonus=0;state.runSkills={};state.runCrit=0;state.runSkillBonus=0;state.runHealOnKill=0;state.runClawBonus=0;state.runLootBonus=0;state.runVenom=0;state.pendingLevelUps=0;state.levelChoices=null;state.wave=1;state.kills=0;state.score=0;state.coins=profile.coins;state.maxHp=effectiveMaxHp();state.hp=state.maxHp;state.damage=effectiveDamage();state.shield=0;state.playerX=86;state.enemies=[];state.bullets=[];state.particles=[];state.floaters=[];state.clawMode="idle";state.clawX=310;state.clawY=565;state.grabbed=null;state.bossSpawned=false;state.settingsOpen=false;state.helpOpen=false;state.upgradesOpen=false;spawnStageWave();notify("WYPRAWA ROZPOCZĘTA!")}
let audio=null;
try{state.coins=profile.coins;state.bestScore=profile.bestScore;state.sound=localStorage.getItem("clawQuestSound")!=="false";state.effects=localStorage.getItem("clawQuestEffects")!=="false";state.bestScore=Number(localStorage.getItem("clawQuestBest")||0)||0}catch(e){}
function beep(freq=440,duration=.07,type="sine",volume=.035){
 if(!state.sound)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const now=audio.currentTime;
  const voice=(hz,gain,shape,detune=0)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=shape;o.frequency.setValueAtTime(hz,now);o.detune.setValueAtTime(detune,now);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(Math.max(.001,gain),now+.012);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+duration+.015)};
  voice(freq,volume,type);voice(freq*2,volume*.2,"sine",5);
 }catch(e){}
}
function rounded(x,y,w,h,r,fill,stroke,lw=1){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}

function text(s,x,y,size=14,color="#fff",weight=800,align="left"){

function glow(x,y,r,color,alpha=.35){

function drawBackground(){

 const p=palettes[def.biome]||palettes.forest,g=ctx.createLinearGradient(0,80,0,505);g.addColorStop(0,p.sky1);g.addColorStop(.55,p.sky2);g.addColorStop(1,p.sky3);
 ctx.fillStyle=g;ctx.fillRect(0,75,W,430);glow(345,170,125,def.biome==="boss"?"#ff947d":"#ffe39b",.2);

 for(let i=0;i<18;i++){const x=i*29+(i%2)*8;ctx.fillStyle=i%2?"#ffffff24":"#fff2bf30";ctx.beginPath();ctx.ellipse(x,455+(i%3)*10,7,2,0,0,Math.PI*2);ctx.fill()}

 state.clawMode="down";state.clawTimer=0;state.grabbed=null;beep(310,.08,"triangle");
}
function moveClaw(dir){if(state.clawMode==="idle"){state.clawX=clamp(state.clawX+dir*23,54,396);beep(230,.03,"square",.015)}}
function notify(msg){toastEl.textContent=msg;toastEl.classList.add("show");state.toastTimer=1.35}
function reset(){return startRun(profile.unlockedStage)}
function interact(x,y){
 if(state.levelChoices){if(y>=270&&y<=600){const index=clamp(Math.floor((y-270)/108),0,2);chooseAbility(index)}return}
 if(state.settingsOpen){if(y>=345&&y<=400&&x>=270){state.sound=!state.sound;try{localStorage.setItem("clawQuestSound",String(state.sound))}catch(e){}beep(520,.05);return}if(y>=415&&y<=480&&x>=270){state.effects=!state.effects;try{localStorage.setItem("clawQuestEffects",String(state.effects))}catch(e){}beep(420,.05);return}if(y>=500&&y<=565){state.settingsOpen=false;return}return}
 if(state.upgradesOpen){if(y>=309&&y<=365&&x>=270){purchaseUpgrade("attack");return}if(y>=391&&y<=447&&x>=270){purchaseUpgrade("vitality");return}if(y>=473&&y<=529&&x>=270){purchaseUpgrade("claw");return}if(y>=555&&y<=605){state.upgradesOpen=false;return}return}
 if(state.helpOpen){if(y>=545&&y<=610){state.helpOpen=false;return}return}
 if(state.screen==="title"){if(y>=625&&y<=680){startRun(profile.unlockedStage);return}if(y>=680&&y<=735){if(x<155)state.upgradesOpen=true;else if(x<285)state.settingsOpen=true;else state.helpOpen=true;return}return}
 if(state.over){if(y>430&&y<510)reset();return}
 if(state.stageCleared){if(y>=435&&y<=505){advanceStage();return}return}
 if(state.paused){if(y>=365&&y<=420){state.paused=false;return}if(y>=425&&y<=480){state.settingsOpen=true;return}if(y>=480&&y<=540){state.paused=false;state.started=false;state.over=false;state.screen="title";state.enemies=[];state.particles=[];state.floaters=[];return}return}
 if(y<60&&x>400){state.paused=true;return}if(y<60&&x>365){state.sound=!state.sound;try{localStorage.setItem("clawQuestSound",String(state.sound))}catch(e){}beep(520,.05);return}
 if(y>=450&&y<=495){if(x<146)combatAttack();else if(x<276)combatDefend();else combatSkill();return}
 if(y>=680&&y<=735){if(x<85)moveClaw(-1);else if(x<150)moveClaw(1);else if(x>285)deployClaw();return}
 if(y>=500&&y<675){if(state.clawMode==="idle")state.clawX=clamp(x,54,396);return}
 if(y>330&&y<420&&state.turn==="player"&&state.enemies.length){let near=-1,best=1e9;state.enemies.forEach((en,i)=>{if(en.dying||en.hp<=0)return;const d=Math.abs(en.x-x)+Math.abs(en.y-y);if(d<best){best=d;near=i}});if(near>=0&&best<120){state.selectedEnemy=near;notify("CEL: "+enemyName(state.enemies[near]))}}
}
let pointerStart=null;
canvas.addEventListener("pointerdown",e=>{
 const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 pointerStart={x,y,id:e.pointerId};canvas.setPointerCapture(e.pointerId);interact(x,y);
});
canvas.addEventListener("pointermove",e=>{
 if(!pointerStart||state.clawMode!=="idle")return;
 if(pointerStart.y>500&&pointerStart.y<675){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;state.clawX=clamp(x,54,396)}
});
canvas.addEventListener("pointerup",()=>{pointerStart=null});
window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," ","a","d","A","D","f","F","Escape","Enter"].includes(e.key))e.preventDefault();
 if(e.key==="Escape"){
  if(state.settingsOpen){state.settingsOpen=false;return}
  if(state.helpOpen){state.helpOpen=false;return}
  if(state.screen==="game"&&!state.over)state.paused=!state.paused;
  return;
 }
 if(state.screen==="title"){
  if(e.key==="Enter"&&!state.settingsOpen&&!state.helpOpen)reset();
  return;
 }
 if(state.settingsOpen||state.helpOpen||state.paused||state.over)return;
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveClaw(-1);
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveClaw(1);
 if(e.key===" "||e.key.toLowerCase()==="f")deployClaw();
 if(e.key.toLowerCase()==="j")combatAttack();if(e.key.toLowerCase()==="k")combatDefend();if(e.key.toLowerCase()==="l")combatSkill();
});
function update(dt){
 state.time+=dt;if(state.toastTimer>0){state.toastTimer-=dt;if(state.toastTimer<=0)toastEl.classList.remove("show")}
 if(state.screen!=="game"||state.paused||state.over||state.stageCleared||state.levelChoices)return;
 updateCharacterAnimations(dt);for(const e of state.enemies)e.phase+=dt*2;
 if(state.turn==="enemy"){state.turnTimer-=dt;if(state.turnTimer<=0)resolveEnemyTurn()}
 const alive=[];for(const e of state.enemies){if(e.hp<=0&&!e.dying){defeat(e);e.dying=true;e.action="death";e.deathTimer=.46;e.actionTimer=0}if(e.dying&&e.deathTimer<=0)continue;alive.push(e)}state.enemies=alive;
 if(state.enemies[state.selectedEnemy]?.dying){const next=state.enemies.findIndex(e=>!e.dying&&e.hp>0);state.selectedEnemy=next<0?0:next}
 if(!state.enemies.length&&state.turn==="player"){if(state.stageWave<stageDefinition().waves.length)spawnStageWave();else completeStage()}
 if(state.hp<=0){state.hp=0;state.over=true;profile.bestScore=Math.max(profile.bestScore,state.score);state.bestScore=profile.bestScore;profile.bestStage=Math.max(profile.bestStage,state.stage);saveProfile();return}
 if(state.playerHit>0)state.playerHit-=dt;
 for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt}state.particles=state.particles.filter(p=>p.life>0);if(!state.effects)state.particles=[];
 for(const f of state.floaters){f.y-=22*dt;f.life-=dt}state.floaters=state.floaters.filter(f=>f.life>0);
 if(state.clawMode==="down"){state.clawY=Math.min(713,state.clawY+250*dt);if(state.clawY>=700){const options=[{type:"coin",x:62},{type:"gem",x:128},{type:"star",x:194},{type:"heart",x:260},{type:"bomb",x:326},{type:"gem",x:392}],nearest=options.reduce((a,b)=>Math.abs(b.x-state.clawX)<Math.abs(a.x-state.clawX)?b:a),tolerance=42+profile.clawRank*4+state.runClawBonus;if(Math.abs(nearest.x-state.clawX)<tolerance){state.grabbed=nearest;state.clawMode="return";notify("ZŁAPANO NAGRODĘ!");beep(760,.12,"triangle")}else{state.clawMode="return";notify("PUSTY CHWYT!");beep(180,.12,"triangle")}}}
 else if(state.clawMode==="return"){state.clawY=Math.max(565,state.clawY-280*dt);if(state.clawY<=565){state.clawMode="idle";if(state.grabbed)reward(state.grabbed.type);state.grabbed=null}}
 for(const s of state.stars){s.y+=s.v*dt;if(s.y>500)s.y=85}
}
function frame(ts){
 const dt=Math.min(.033,(ts-state.last)/1000||0);state.last=ts;
 update(dt);draw();requestAnimationFrame(frame);
}
for(let i=0;i<30;i++)state.stars.push({x:rand(5,W-5),y:rand(90,490),r:rand(.6,1.8),a:rand(.15,.55),v:rand(4,16)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state.screen==="game")state.paused=true});
if(window.location?.search?.includes("test=1"))window.__CLAW_TEST_API__={state,profile,stageCatalog,abilityPool,startRun,reset,spawnEnemy,spawnStageWave,completeStage,advanceStage,purchaseUpgrade,saveProfile,loadProfile,gainCoins,gainXp,rollAbilityChoices,chooseAbility,combatAttack,combatDefend,combatSkill,resolveEnemyTurn,reward,moveClaw,deployClaw,interact,update,stageDefinition};
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
draw();requestAnimationFrame(frame);
})();
</script>
