 if(!state.sound)return;
 try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.stop(audio.currentTime+duration)}catch(e){}

 ctx.fillStyle="#255b61";ctx.beginPath();ctx.moveTo(0,354);ctx.quadraticCurveTo(70,280,145,355);ctx.quadraticCurveTo(250,265,340,355);ctx.quadraticCurveTo(405,300,450,344);ctx.lineTo(450,505);ctx.lineTo(0,505);ctx.fill();

function drawHero(x,y){
 const duration=Math.max(.001,state.playerActionDuration||.42);
 const progress=clamp(1-(state.playerActionTimer||0)/duration,0,1);
 const action=state.playerActionTimer>0?state.playerAction:(state.defending?"defend":"idle");
 const swing=Math.sin(progress*Math.PI);
 const idle=Math.sin(state.time*4.2)*1.7;
 const hurt=action==="hurt";

 ctx.save();ctx.translate(x,y+idle-(attack||special?swing*2:0));

 if(hurt)glow(-2,-24,38,"#ff667d",.18);

 ctx.fillStyle="#f06d83";ctx.beginPath();ctx.moveTo(-10,-35);ctx.quadraticCurveTo(-24+capeWave,-21,-20+capeWave,-3);ctx.quadraticCurveTo(-8,-8,-2,-28);ctx.closePath();ctx.fill();
 ctx.strokeStyle="#ffb0a8";ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(-9,-31);ctx.quadraticCurveTo(-18+capeWave,-14,-19+capeWave,0);ctx.stroke();

 rounded(-16,-12+step,12,20,5,"#334d83","#20365d",1);
 rounded(2,-12-step,12,20,5,"#334d83","#20365d",1);
 rounded(-19,2+step,17,8,4,"#f2b75d","#ffe1a1",1);
 rounded(0,2-step,17,8,4,"#f2b75d","#ffe1a1",1);

 ctx.fillStyle=tunic;ctx.strokeStyle="#9bc8f2";ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-16,-39);ctx.quadraticCurveTo(0,-48,16,-39);ctx.lineTo(18,-10);ctx.quadraticCurveTo(0,-1,-18,-10);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.save();ctx.rotate(-.14);rounded(-4,-34,8,23,3,"#e6b94f","#fff0b1",1);ctx.restore();
 line(-9,-35,10,-15,"#c9a36a",3);rounded(5,-23,7,7,2,"#f7d275","#fff1bd",1);
 // animated arms
 const armSwing=attack?-.78*swing:special?-1.05*swing:guard?-.38:Math.sin(state.time*4)*.035;

 // head, hair, eyebrows and face
 ctx.fillStyle="#f2c18d";ctx.strokeStyle="#ffe5c5";ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(0,-49,17,0,Math.PI*2);ctx.fill();ctx.stroke();

 ctx.fillStyle="#2b3552";ctx.beginPath();ctx.arc(6,-48,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-5,-48,2,0,Math.PI*2);ctx.fill();

 ctx.strokeStyle="#9b4e45";ctx.lineWidth=1.7;ctx.beginPath();ctx.arc(0,-43,5,.15,Math.PI-.15);ctx.stroke();

 ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(-3,-4);ctx.lineTo(0,-22);ctx.lineTo(4,-4);ctx.closePath();ctx.fill();
 line(0,-18,0,-5,"#8fe8f1",1.5);rounded(-8,0,17,5,2,"#ffcf66","#fff0b1",1);rounded(-2,16,5,10,2,"#8a5839","#dca66c",1);
 ctx.restore();
 // readable attack slash trail and guard shield
 if((attack||special)&&progress>.12&&progress<.94){
  ctx.save();ctx.globalAlpha=(1-Math.abs(progress-.52)*1.5)*.72;ctx.strokeStyle=special?"#9effff":"#fff0a8";ctx.lineWidth=special?5:3;

function drawEnemy(e){
 ctx.save();ctx.translate(e.x,e.y);
 const dyingProgress=e.dying?clamp(1-(e.deathTimer||0)/.46,0,1):0;

 if(state.turn!=="player"||!state.started||state.over||!state.skillReady)return;
 const e=state.enemies[state.selectedEnemy]||state.enemies[0];if(!e)return;
 const dmg=state.damage*3+4;e.hp-=dmg;state.skillReady=false;state.playerAction="special";state.playerActionDuration=.58;state.playerActionTimer=.58;e.hit=.32;
 state.playerHit=.25;for(let i=0;i<18;i++)particle(e.x,e.y,pick(["#a7ffff","#ffdb78","#ff9bbd"]),rand(3,6));
 popText("SUPER -"+dmg,e.x,e.y-48,"#ffb8ff");notify("MOCNY CIOS!");state.turn="enemy";state.turnTimer=.85;state.defending=false;beep(880,.15,"sawtooth");
 setTimeout(()=>{state.skillReady=true},4500);
}
function resolveEnemyTurn(){
 if(state.turn!=="enemy")return;
 const active=state.enemies.filter(e=>!e.dying);
 if(active.length){
  const target=active.reduce((a,b)=>a.x>b.x?a:b);
  target.action="attack";target.actionDuration=.38;target.actionTimer=.38;
  const guarded=state.defending;
  const raw=target.type==="boss"?Math.ceil(target.damage/3):target.damage;
  const dmg=guarded?Math.max(1,Math.ceil(raw*.35)):raw;
  if(state.shield>0){state.shield=Math.max(0,state.shield-dmg);popText("TARCZA",state.playerX,state.playerY-65,"#83f6e9")}
  else {state.hp=Math.max(0,state.hp-dmg);popText("-"+dmg,state.playerX,state.playerY-65,"#ff8d9e");state.playerHit=.2;state.playerAction=guarded?"defend":"hurt";state.playerActionDuration=guarded?.34:.3;state.playerActionTimer=guarded?.34:.3;beep(170,.12,"sawtooth")}
  if(target.type==="boss"&&Math.random()<.3&&!guarded){state.hp=Math.max(0,state.hp-4);popText("MOC BOSS +4",state.playerX,state.playerY-90,"#ff9cbd")}
 }
 state.defending=false;state.turn="player";
 const aliveIndex=state.enemies.findIndex(e=>!e.dying);
 state.selectedEnemy=aliveIndex<0?0:clamp(state.selectedEnemy,0,Math.max(0,state.enemies.length-1));
 if(state.enemies[state.selectedEnemy]?.dying)state.selectedEnemy=aliveIndex<0?0:aliveIndex;
 notify("TWOJA TURA");
}
function updateCharacterAnimations(dt){
 if(state.playerActionTimer>0){
  state.playerActionTimer=Math.max(0,state.playerActionTimer-dt);
  if(state.playerActionTimer===0)state.playerAction="idle";
 }
 for(const e of state.enemies){
  if(e.hit>0)e.hit=Math.max(0,e.hit-dt);
  if(e.actionTimer>0){
   e.actionTimer=Math.max(0,e.actionTimer-dt);
   if(e.actionTimer===0)e.action="idle";
  }
  if(e.dying&&e.deathTimer>0)e.deathTimer=Math.max(0,e.deathTimer-dt);
 }
}
function deployClaw(){
 if(!state.started||state.over||state.paused||state.clawMode!=="idle")return;
 state.clawMode="down";state.clawTimer=0;state.grabbed=null;beep(310,.08,"triangle");
}
function moveClaw(dir){if(state.clawMode==="idle"){state.clawX=clamp(state.clawX+dir*23,54,396);beep(230,.03,"square",.015)}}
function notify(msg){toastEl.textContent=msg;toastEl.classList.add("show");state.toastTimer=1.35}
function reset(){
 state.started=true;state.paused=false;state.over=false;state.screen="game";state.time=0;state.spawn=0;state.shot=0;state.turn="player";state.turnTimer=0;state.defending=false;state.selectedEnemy=0;state.playerAction="idle";state.playerActionTimer=0;state.skillReady=true;state.wave=1;state.kills=0;state.score=0;state.coins=0;state.hp=100;state.maxHp=100;state.damage=1;state.shield=0;state.playerX=86;state.enemies=[];state.bullets=[];state.particles=[];state.floaters=[];state.clawMode="idle";state.clawX=310;state.clawY=565;state.grabbed=null;state.bossSpawned=false;state.skillReady=true;state.settingsOpen=false;state.helpOpen=false;for(let i=0;i<2;i++)spawnEnemy();notify("WYPRAWA ROZPOCZĘTA!");
}
function interact(x,y){
 if(state.settingsOpen){
  if(y>=345&&y<=400&&x>=270){state.sound=!state.sound;try{localStorage.setItem("clawQuestSound",String(state.sound))}catch(e){}beep(520,.05);return}
  if(y>=415&&y<=480&&x>=270){state.effects=!state.effects;try{localStorage.setItem("clawQuestEffects",String(state.effects))}catch(e){}beep(420,.05);return}
  if(y>=500&&y<=565){state.settingsOpen=false;return}return;
 }
 if(state.helpOpen){if(y>=545&&y<=610){state.helpOpen=false;return}return}
 if(state.screen==="title"){
  if(y>=600&&y<=666){reset();return}
  if(y>=670&&y<=725){if(x<225)state.settingsOpen=true;else state.helpOpen=true;return}return;
 }
 if(state.over){if(y>430&&y<510)reset();return}
 if(state.paused){
  if(y>=365&&y<=420){state.paused=false;return}
  if(y>=425&&y<=480){state.settingsOpen=true;return}
  if(y>=480&&y<=540){state.paused=false;state.started=false;state.over=false;state.screen="title";state.enemies=[];state.particles=[];state.floaters=[];return}return;
 }
 if(y<60&&x>400){state.paused=true;return}
 if(y<60&&x>365){state.sound=!state.sound;try{localStorage.setItem("clawQuestSound",String(state.sound))}catch(e){}beep(520,.05);return}
 if(y>455&&y<495){if(x<146)combatAttack();else if(x<276)combatDefend();else combatSkill();return}
 if(y>674&&y<735){if(x<85)moveClaw(-1);else if(x<150)moveClaw(1);else if(x>285)deployClaw();return}
 if(y>=500&&y<=674){moveClaw(x<state.clawX?-1:1);return}
 if(y>330&&y<420&&state.turn==="player"&&state.enemies.length){let near=0,best=1e9;state.enemies.forEach((en,i)=>{let d=Math.abs(en.x-x)+Math.abs(en.y-y);if(d<best){best=d;near=i}});if(best<110){state.selectedEnemy=near;notify("CEL: "+enemyName(state.enemies[near]));}}
}
let pointerStart=null;
canvas.addEventListener("pointerdown",e=>{
 const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 pointerStart={x,y,id:e.pointerId};canvas.setPointerCapture(e.pointerId);interact(x,y);
});
canvas.addEventListener("pointermove",e=>{
 if(!pointerStart||state.clawMode!=="idle")return;
 if(e.pointerType==="touch"&&pointerStart.y>500&&pointerStart.y<675){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;state.clawX=clamp(x,54,396)}
});
canvas.addEventListener("pointerup",()=>{pointerStart=null});
window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," ","a","d","A","D","f","F","Escape","Enter"].includes(e.key))e.preventDefault();
 if(e.key==="Escape"){
  if(state.settingsOpen){state.settingsOpen=false;return}
  if(state.helpOpen){state.helpOpen=false;return}
  if(state.screen==="game"&&!state.over)state.paused=!state.paused;
  return;
 }
 if(state.screen==="title"){
  if(e.key==="Enter"&&!state.settingsOpen&&!state.helpOpen)reset();
  return;
 }
 if(state.settingsOpen||state.helpOpen||state.paused||state.over)return;
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveClaw(-1);
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveClaw(1);
 if(e.key===" "||e.key.toLowerCase()==="f")deployClaw();
 if(e.key.toLowerCase()==="j")combatAttack();if(e.key.toLowerCase()==="k")combatDefend();if(e.key.toLowerCase()==="l")combatSkill();
});
function update(dt){
 state.time+=dt;
 if(state.toastTimer>0){state.toastTimer-=dt;if(state.toastTimer<=0)toastEl.classList.remove("show")}
 if(state.screen!=="game"||state.paused||state.over)return;
 // visual-only idle movement of enemy bodies; actions are resolved in discrete turns.
 updateCharacterAnimations(dt);
 for(const e of state.enemies){e.phase+=dt*2}
 if(state.turn==="enemy"){state.turnTimer-=dt;if(state.turnTimer<=0)resolveEnemyTurn()}
 const alive=[];
 for(const e of state.enemies){
  if(e.hp<=0&&!e.dying){defeat(e);e.dying=true;e.action="death";e.deathTimer=.46;e.actionTimer=0}
  if(e.dying&&e.deathTimer<=0)continue;
  alive.push(e);
 }
 state.enemies=alive;
 if(state.enemies[state.selectedEnemy]?.dying){
  const nextTarget=state.enemies.findIndex(e=>!e.dying);
  state.selectedEnemy=nextTarget<0?0:nextTarget;
 }
 if(!state.enemies.length&&state.turn==="player"&&!state.over){state.wave++;state.spawn=0;state.bossSpawned=false;const count=state.wave%5===0?1:Math.min(2+Math.floor(state.wave/2),5);for(let i=0;i<count;i++)spawnEnemy();state.selectedEnemy=0;notify("FALA "+state.wave+" • "+(state.wave%5===0?"BOSS":"NOWI WROGOWIE"));}
 if(state.hp<=0){state.hp=0;state.over=true;if(state.score>state.bestScore){state.bestScore=state.score;try{localStorage.setItem("clawQuestBest",String(state.bestScore))}catch(e){}}return}
 if(state.playerHit>0)state.playerHit-=dt;
 if(state.shield>0)state.shield-=dt;
 for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt}
 state.particles=state.particles.filter(p=>p.life>0);
 if(!state.effects)state.particles=[];
 for(const f of state.floaters){f.y-=22*dt;f.life-=dt}
 state.floaters=state.floaters.filter(f=>f.life>0);
 if(state.clawMode==="down"){
  state.clawY=Math.min(713,state.clawY+250*dt);
  if(state.clawY>=700){const options=[{type:"coin",x:62},{type:"gem",x:128},{type:"star",x:194},{type:"heart",x:260},{type:"bomb",x:326},{type:"gem",x:392}];const nearest=options.reduce((a,b)=>Math.abs(b.x-state.clawX)<Math.abs(a.x-state.clawX)?b:a);if(Math.abs(nearest.x-state.clawX)<42){state.grabbed=nearest;state.clawMode="return";notify("ZŁAPANO NAGRODĘ!");beep(760,.12,"triangle")}else{state.clawMode="return";notify("PUSTY CHWYT!");beep(180,.12,"triangle")}}
 }else if(state.clawMode==="return"){
  state.clawY=Math.max(565,state.clawY-280*dt);
  if(state.clawY<=565){state.clawMode="idle";if(state.grabbed)reward(state.grabbed.type);state.grabbed=null}
 }
 for(const s of state.stars){s.y+=s.v*dt;if(s.y>500)s.y=85}
}
function frame(ts){
 const dt=Math.min(.033,(ts-state.last)/1000||0);state.last=ts;
 update(dt);draw();requestAnimationFrame(frame);
}
for(let i=0;i<30;i++)state.stars.push({x:rand(5,W-5),y:rand(90,490),r:rand(.6,1.8),a:rand(.15,.55),v:rand(4,16)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state.screen==="game")state.paused=true});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
draw();requestAnimationFrame(frame);
})();
</script>
