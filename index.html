<script>
(() => {

let viewTransform={dpr:1,scale:1,offsetX:0,offsetY:0};
function resizeCanvas(){
 const rect=canvas.getBoundingClientRect(),dpr=clamp(Number(window.devicePixelRatio)||1,1,2.75);

 ctx.setTransform(dpr*scale,0,0,dpr*scale,dpr*viewTransform.offsetX,dpr*viewTransform.offsetY);
}

resizeCanvas();

 started:false,paused:false,over:false,sound:false,clawUsedThisTurn:false,machinePrizes:[],poisonTurns:0,poisonDamage:2,

 wave:1,kills:0,score:0,coins:0,hp:100,maxHp:100,damage:1,shield:0,weaponId:"sidearm",weaponLevel:1,guardTurns:0,skillCooldownTurns:0,prizeRefreshTimer:0,
 playerX:124,heroRenderX:124,playerY:408,playerHit:0,flash:0,playerAction:"idle",playerActionTimer:0,playerActionDuration:.42,shotFxTimer:0,shotFxDuration:.32,shotFxWeaponId:"sidearm",heroLunge:0,screenFlash:0,screenFlashColor:"#ffd166",camKickX:0,camKickY:0,camPanX:0,camPanY:0,renderShakeX:0,renderShakeY:0,
 enemies:[],bullets:[],particles:[],loot:[],impacts:[],pressFx:[],xpFlyOrbs:[],attackFx:null,shake:0,stars:[],floaters:[],skillReady:true,levelChoices:null,pendingLevelUps:0,runSkills:{},runLevel:1,runXp:0,runXpNeed:15,runCrit:0,runClawBonus:0,runSkillBonus:0,runHealOnKill:0,runLootBonus:0,runVenom:0,runBleed:0,runWard:0,runCounterBonus:0,

 {id:"repeater",name:"Bliźniaczy Łuk",rate:.29,damage:2.7,speed:560,color:"#79eaff",pellets:1,spread:.012,radius:3.2,role:"Podwójne trafienie magiczną strzałą"},

 {id:"cannon",name:"Krasnoludzka Armata",rate:1.12,damage:10,speed:300,color:"#ffbd72",pellets:1,spread:.018,radius:7,splash:48,role:"Potężny wybuch obszarowy wokół celu"},
 {id:"laser",name:"Lanca Słoneczna",rate:.66,damage:7,speed:780,color:"#b6faff",pellets:1,spread:0,radius:3.5,pierce:1,role:"Przebija promieniem kolejnego wroga"}
];
const weaponForRun=()=>weaponCatalog.find(w=>w.id===state.weaponId)||weaponCatalog[0];
const currentWeaponDamage=()=>Math.ceil((weaponForRun().damage+profile.attackRank+state.runDamageBonus+(state.clawEmpowered||0)+(state.heroVanguard||0))*(1+(state.weaponLevel-1)*.18));
const stageCatalog=[

 {title:"Zarośnięta Ścieżka",biome:"forest",objective:"Użyj kroku taktycznego, aby wyjść z zasięgu ciosu wroga.",waves:[["slime","slime"],["slime","bat"]],coins:28,xp:26},
 {title:"Nora Zmierzchu",biome:"cave",objective:"Zbieraj kule XP dla kart synergii i uważaj na kolce Jeżoryja.",waves:[["bat","slime"],["porcupine","slime","bat"]],coins:38,xp:34},
 {title:"Ruiny Strażników",biome:"ruins",objective:"Czytaj czerwone pola zagrożenia i przełamuj pancerz goblinów.",waves:[["goblin","goblin","bat"],["porcupine","goblin","slime"]],coins:50,xp:42},
 {title:"Leśny Strażnik",biome:"boss",objective:"Strażnik w szale bije z daleka — łącz uniki z kontratakiem.",waves:[["boss","porcupine"]],coins:85,xp:70}
];
const starterProfile=()=>({coins:0,xp:0,level:1,attackRank:0,vitalityRank:0,clawRank:0,unlockedStage:1,bestStage:1,bestScore:0});
function loadProfile(){try{const raw=localStorage.getItem(PROFILE_KEY);if(!raw)return starterProfile();const data=JSON.parse(raw),base=starterProfile();for(const key of Object.keys(base)){const value=Number(data?.[key]);base[key]=Number.isFinite(value)?Math.max(0,Math.floor(value)):base[key]}base.level=Math.max(1,base.level);base.unlockedStage=Math.max(1,Math.min(99,base.unlockedStage));return base}catch(e){return starterProfile()}}
let profile=loadProfile();
state.hubStage=profile.unlockedStage;
function saveProfile(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));return true}catch(e){return false}}
function stageDefinition(stage=state.stage){if(stage<=stageCatalog.length)return stageCatalog[Math.max(0,stage-1)];const n=stage-stageCatalog.length;return {title:"Dzika Knieja "+n,biome:n%3===0?"ruins":n%3===1?"forest":"cave",objective:"Przetrwaj kolejne fale i rozwijaj synergie kart.",waves:[["slime","bat","goblin"],["porcupine","goblin","bat"],["porcupine","goblin","slime","bat"]],coins:55+n*8,xp:45+n*5}}
function gainCoins(amount){const n=Math.max(0,Math.floor(amount));profile.coins+=n;state.coins=profile.coins;saveProfile();return n}
const abilityPool=[
 {id:"edge",name:"Ostrze runiczne",tag:"ATAK",syn:"furia",desc:"+2 do obrażeń każdego ataku",color:"#ffb65c",max:4},
 {id:"vital",name:"Serce olbrzyma",tag:"ŻYWOTNOŚĆ",syn:"",desc:"+20 maks. HP i natychmiastowe leczenie",color:"#ff7798",max:4},
 {id:"bulwark",name:"Aegis",tag:"OBRONA",syn:"bastion",desc:"+18 punktów tarczy natychmiast",color:"#71dfff",max:4},
 {id:"execution",name:"Precyzyjne cięcie",tag:"KRYTYK",syn:"furia",desc:"+8% szansy na podwójne obrażenia",color:"#f6db7b",max:5},
 {id:"reaper",name:"Głód łowcy",tag:"REGENERACJA",syn:"",desc:"Odzyskaj 3 HP za pokonanego wroga",color:"#8de6a8",max:4},
 {id:"storm",name:"Burza eteru",tag:"SUPER",syn:"furia",desc:"+4 obrażenia superataku",color:"#b69aff",max:4},
 {id:"claw",name:"Magnes skarbów",tag:"CHWYTAK",syn:"zloto",desc:"+12 px tolerancji chwytu",color:"#72e8dd",max:4},
 {id:"fortune",name:"Złoty instynkt",tag:"ŁUP",syn:"zloto",desc:"+50% monet z chwytaka",color:"#ffd36c",max:3},
 {id:"venom",name:"Toksyczna amunicja",tag:"TRUCIZNA",syn:"korozja",desc:"Trafienia zatruwają cel na 2 fazy; +1 dmg/poz.",color:"#a5e477",max:3},
 {id:"bleed",name:"Krwawy znak",tag:"KRWAWIENIE",syn:"korozja",desc:"Ataki krwawią wroga przez 2 fazy",color:"#ff8194",max:3},
 {id:"ward",name:"Żelazna przysięga",tag:"TARCZA",syn:"bastion",desc:"Odnów 2 pkt. tarczy na starcie tury",color:"#9fc9ff",max:4},
 {id:"riposte",name:"Runa riposty",tag:"KONTRATAK",syn:"bastion",desc:"+2 obrażeń w kontrataku",color:"#82e5f2",max:4}
];
const synergyCatalog=[
 {id:"korozja",name:"KOROZJA",req:["venom","bleed"],color:"#a5e477",bg:"#244a20",desc:"Trucizna bije mocniej w krwawiących wrogów"},
 {id:"bastion",name:"BASTION",req:["ward","riposte"],alt:["ward","bulwark"],color:"#74e3ff",bg:"#173e5c",desc:"+3 dmg kontrataku i odbicie 3 dmg z tarczy"},
 {id:"furia",name:"FURIA ETERU",req:["edge","execution"],alt:["storm","execution"],color:"#ffd666",bg:"#523714",desc:"Krytyk skraca odnowienie Skilla i daje +3 Tarczy"},
 {id:"zloto",name:"ZŁOTY CHWYT",req:["claw","fortune"],color:"#ffe075",bg:"#4d3a12",desc:"Łupy ze skrzyni dają +4 XP Wyprawy i +2◆"}
];
function getActiveSynergies(){
 const s=state.runSkills||{};
 return synergyCatalog.filter(syn=>{
  const okMain=syn.req.every(id=>(s[id]||0)>0);
  const okAlt=syn.alt&&syn.alt.every(id=>(s[id]||0)>0);
  return okMain||okAlt;
 });
}
function synergyForCandidate(a){
 if(!a||!a.syn)return null;
 const syn=synergyCatalog.find(s=>s.id===a.syn);
 if(!syn)return null;
 const s=state.runSkills||{};
 const already=getActiveSynergies().some(x=>x.id===syn.id);
 if(already)return {syn,state:"active"};
 const partnerOwned=(syn.req.includes(a.id)&&syn.req.some(id=>id!==a.id&&(s[id]||0)>0))||(syn.alt&&syn.alt.includes(a.id)&&syn.alt.some(id=>id!==a.id&&(s[id]||0)>0));
 return {syn,state:partnerOwned?"completes":"potential"};
}
function rollAbilityChoices(){
 const available=abilityPool.filter(a=>(state.runSkills[a.id]||0)<a.max);
 if(!available.length){state.pendingLevelUps=0;state.levelChoices=null;notify("WSZYSTKIE UMIEJĘTNOŚCI MAKSYMALNE");return}
 const prioritized=available.slice().sort((a,b)=>{
  const sa=synergyForCandidate(a),sb=synergyForCandidate(b);
  const wa=(sa?.state==="completes"?3:(state.runSkills[a.id]||0)>0?1.5:0)+Math.random()*2;
  const wb=(sb?.state==="completes"?3:(state.runSkills[b.id]||0)>0?1.5:0)+Math.random()*2;
  return wb-wa;
 });
 const choices=prioritized.slice(0,3);
 state.levelChoices=choices;playSfx("level");notify("AWANS! WYBIERZ 1 Z 3 KART SKILLI");
}
function chooseAbility(index){
 if(!state.levelChoices||!state.levelChoices[index])return false;
 const a=state.levelChoices[index];state.runSkills[a.id]=(state.runSkills[a.id]||0)+1;
 if(a.id==="edge")state.runDamageBonus+=2;
 if(a.id==="vital"){state.maxHp+=20;state.hp=Math.min(state.maxHp,state.hp+20)}
 if(a.id==="bulwark")state.shield+=18;
 if(a.id==="execution")state.runCrit+=.08;
 if(a.id==="reaper")state.runHealOnKill+=3;
 if(a.id==="storm")state.runSkillBonus+=4;
 if(a.id==="claw")state.runClawBonus+=12;
 if(a.id==="fortune")state.runLootBonus+=.5;
 if(a.id==="venom")state.runVenom+=1;
 if(a.id==="bleed")state.runBleed+=1;
 if(a.id==="ward")state.runWard+=1;
 if(a.id==="riposte")state.runCounterBonus+=2;
 state.damage=effectiveDamage();state.pendingLevelUps=Math.max(0,state.pendingLevelUps-1);state.levelChoices=null;
 const synInfo=synergyForCandidate(a);
 beep(980,.1,"triangle",.05);
 if(state.pendingLevelUps>0)rollAbilityChoices();
 else notify(synInfo?.state==="active"?("SYNERGIA "+synInfo.syn.name+" AKTYWNA!"):(a.name.toUpperCase()+" • POZ. "+state.runSkills[a.id]));
 return true;
}
function gainRunXp(amount){
 const n=Math.max(0,Math.floor(amount));if(!n)return 0;

 let levels=0;
 while(state.runXp>=state.runXpNeed){
  state.runXp-=state.runXpNeed;state.runLevel=(state.runLevel||1)+1;
  state.runXpNeed=15+(state.runLevel-1)*8;levels++;

}

}
function effectiveDamage(){return 4+profile.attackRank+state.runDamageBonus}

 for(let i=0;i<ARENA_TILES.length;i++){const d=Math.abs(ARENA_TILES[i]-x);if(d<dist){dist=d;best=i}}

}
function getHeroStance(){

 if(d>=185)return {id:"ranged",label:"DYSTANS",color:"#72efff"};

}
function purchaseUpgrade(kind){const cfg={attack:{rank:"attackRank",base:30,step:20},vitality:{rank:"vitalityRank",base:35,step:20},claw:{rank:"clawRank",base:25,step:18}}[kind];if(!cfg)return false;const rank=profile[cfg.rank],cost=cfg.base+rank*cfg.step;if(profile.coins<cost)return false;profile.coins-=cost;profile[cfg.rank]++;state.coins=profile.coins;const oldMax=state.maxHp;state.damage=effectiveDamage();state.maxHp=effectiveMaxHp();if(kind==="vitality"&&state.started)state.hp=Math.min(state.maxHp,state.hp+state.maxHp-oldMax);saveProfile();playSfx("upgrade");return true}
function enemyAttackRange(e){

}
function maxHeroTileIndex(){

}
function planEnemyIntents(){
 const active=state.enemies.filter(e=>!e.dying&&e.hp>0);
 for(const e of active){
  const range=enemyAttackRange(e);
  const close=e.x-state.playerX<=range;

  if(close&&state.turnNumber>=e.nextAttackTurn)e.intent="attack";
  else if(close)e.intent="brace";
  else e.intent="advance";
  e.spinesActive=e.type==="porcupine"&&e.intent==="brace";
  if(e.type==="goblin"&&e.intent==="brace"&&e.guard<=0)e.guard=3;
 }

function beginPlayerTurn(){

function startRun(stage=state.hubStage||profile.unlockedStage){
 state.clawUsedThisTurn=false;state.heroActionUsedThisTurn=false;state.heroMovedThisTurn=false;state.heroVanguard=0;state.guardTurns=0;state.clawCombo=0;state.clawEmpowered=0;
 state.skillCooldownTurns=0;

const PIT_LEFT=36,PIT_RIGHT=414,PIT_TOP=548;

 if(p.vy===undefined)p.vy=0;

 if(p.angVel===undefined)p.angVel=0;
 if(p.ox===undefined)p.ox=0;
 if(p.oy===undefined)p.oy=0;

    }
   }
  }

}

function draw(){

 ctx.setTransform(1,0,0,1,0,0);
 ctx.clearRect(0,0,canvas.width,canvas.height);

 ctx.fillStyle=bars;ctx.fillRect(0,0,canvas.width,canvas.height);
 ctx.setTransform(viewTransform.dpr*viewTransform.scale,0,0,viewTransform.scale*viewTransform.dpr,viewTransform.dpr*viewTransform.offsetX,viewTransform.dpr*viewTransform.offsetY);
 if(state.screen==="title"){
  drawTitle();if(state.settingsOpen)drawSettingsOverlay();if(state.helpOpen)drawHelpOverlay();if(state.upgradesOpen)drawUpgradeOverlay();
 }else{
  ctx.save();
  const sx=state.effects&&state.shake>0?Math.sin(state.time*78)*state.shake:0;
  const sy=state.effects&&state.shake>0?Math.cos(state.time*63)*state.shake*.62:0;
  state.renderShakeX=sx+(state.camKickX||0);
  state.renderShakeY=sy+(state.camKickY||0);
  ctx.translate(state.renderShakeX,state.renderShakeY);
  drawHeader();drawHealth();drawArena();drawClawMachine();drawOverlay();
  ctx.restore();
 }
 for(const r of state.pressFx){
  const t=clamp(1-r.life/r.max,0,1);
  ctx.save();ctx.globalAlpha=(1-t)*.65;ctx.strokeStyle=r.color;ctx.lineWidth=2.5*(1-t)+.5;
  ctx.beginPath();ctx.arc(r.x,r.y,r.r+t*22,0,Math.PI*2);ctx.stroke();ctx.restore();
 }

 if(state.hp<=0){state.hp=0;state.over=true;state.turnPhase="over";profile.bestScore=Math.max(profile.bestScore,state.score);state.bestScore=profile.bestScore;profile.bestStage=Math.max(profile.bestStage,state.stage);saveProfile();return true}
 if(!state.enemies.some(e=>!e.dying&&e.hp>0)){state.turnPhase="transition";state.turn="enemy";return checkEncounterClear()}

function checkEncounterClear(){

function updateCharacterAnimations(dt){
 const follow=1-Math.exp(-16*dt);
 state.heroRenderX=(state.heroRenderX!==undefined?state.heroRenderX:state.playerX)+(state.playerX-(state.heroRenderX!==undefined?state.heroRenderX:state.playerX))*follow;
 if(state.shotFxTimer>0)state.shotFxTimer=Math.max(0,state.shotFxTimer-dt);
 if(state.heroLunge>0)state.heroLunge=Math.max(0,state.heroLunge-dt*36);
 if(state.screenFlash>0)state.screenFlash=Math.max(0,state.screenFlash-dt*1.2);
 if(state.playerActionTimer>0){state.playerActionTimer=Math.max(0,state.playerActionTimer-dt);if(state.playerActionTimer===0)state.playerAction="idle"}
 for(const e of state.enemies){
  e.phase+=dt*2;
  e.renderX=(e.renderX!==undefined?e.renderX:e.x)+(e.x-(e.renderX!==undefined?e.renderX:e.x))*follow;
  if(e.hit>0)e.hit=Math.max(0,e.hit-dt);
  if(e.hitFlash>0)e.hitFlash=Math.max(0,e.hitFlash-dt);
  if(e.knockX>0)e.knockX=Math.max(0,e.knockX-dt*42);
  if(e.actionTimer>0){e.actionTimer=Math.max(0,e.actionTimer-dt);if(e.actionTimer===0)e.action="idle"}
  if(e.dying&&e.deathTimer>0)e.deathTimer=Math.max(0,e.deathTimer-dt);
 }
 if(state.attackFx){state.attackFx.life=Math.max(0,state.attackFx.life-dt);if(state.attackFx.life<=0)state.attackFx=null}
}

 if(y<60&&x>400){state.paused=true;playSfx("uiClick");return}if(y<60&&x>365){state.sound=!state.sound;try{localStorage.setItem("clawQuestSound",String(state.sound))}catch(e){}playSfx("uiClick");return}
 if(y>=422&&y<=450){if(x>=19&&x<=106){tacticalMove(-1);return}if(x>=107&&x<=196){tacticalMove(1);return}}
 if(y>=451&&y<=495){combatAttack();return}

 if(y>140&&y<420){

  if(near>=0&&best<90){state.selectedEnemy=near;playSfx("uiClick");notify("CEL: "+enemyName(state.enemies[near]))}
 }
}

let pointerStart=null;

});

window.addEventListener("keydown",e=>{

  if(state.settingsOpen){state.settingsOpen=false;return}

  if(state.upgradesOpen){state.upgradesOpen=false;if(state.screen==="title")state.hubTab="battle";return}
  if(state.screen==="game"&&!state.over)state.paused=!state.paused;
  return;
 }
 if(state.screen==="title"){
  if(e.key==="Enter"&&!state.settingsOpen&&!state.helpOpen&&!state.upgradesOpen)reset();
  return;
 }
 if(state.settingsOpen||state.helpOpen||state.paused)return;
 if(state.over){if(e.key==="Enter"||e.key===" "){playSfx("uiClick");reset()}return}
 if(state.stageCleared){if(e.key==="Enter"||e.key===" "){playSfx("uiClick");advanceStage()}return}
 if(state.levelChoices){
  if(["1","2","3"].includes(e.key)){const idx=Number(e.key)-1;if(chooseAbility(idx))playSfx("upgrade")}
  return;
 }
 if(e.key==="Tab"){
  const live=state.enemies.filter(en=>!en.dying&&en.hp>0);
  if(live.length>1){
   const cur=findCombatTarget(),curPos=Math.max(0,live.indexOf(cur));
   const nextEn=live[(curPos+1)%live.length];
   state.selectedEnemy=state.enemies.indexOf(nextEn);
   playSfx("uiClick");notify("CEL: "+enemyName(nextEn));
  }
  return;
 }
 if(["1","2","3","4"].includes(e.key)){
  const live=state.enemies.filter(en=>!en.dying&&en.hp>0),idx=Number(e.key)-1;
  if(live[idx]){state.selectedEnemy=state.enemies.indexOf(live[idx]);playSfx("uiClick");notify("CEL: "+enemyName(live[idx]))}
  return;
 }
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveClaw(-1);
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveClaw(1);
 if(e.key.toLowerCase()==="q")tacticalMove(-1);
 if(e.key.toLowerCase()==="e")tacticalMove(1);
 if(e.key===" "||e.key.toLowerCase()==="f")deployClaw();
 if(["j","k","l"].includes(e.key.toLowerCase())||(e.key===" "&&state.turnPhase==="hero"))combatAttack();
});
function update(dt){
 state.time+=Math.max(0,dt);
 if(state.toastTimer>0){state.toastTimer-=dt;if(state.toastTimer<=0)toastEl.classList.remove("show")}
 for(const pr of state.pressFx)pr.life-=dt;state.pressFx=state.pressFx.filter(pr=>pr.life>0);
 if(state.screen!=="game"||state.paused||state.over||state.stageCleared||state.levelChoices)return;
 updateCharacterAnimations(dt);
 updateChamberPhysics(dt);
 const remaining=[];
 for(const b of state.bullets){b.life-=dt;if(b.life>0)remaining.push(b)}
 state.bullets=remaining;
 for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt}
 state.particles=state.particles.filter(p=>p.life>0);if(!state.effects)state.particles=[];
 for(const orb of (state.xpFlyOrbs||[])){
  orb.t=Math.min(orb.dur,(orb.t||0)+dt);
  const k=orb.t/Math.max(.01,orb.dur);
  orb.x=orb.x+(165-orb.x)*Math.min(1,dt*8);
  orb.y=orb.y+(102-orb.y)*Math.min(1,dt*8);
  if(k>=1)orb.done=true;
 }
 state.xpFlyOrbs=(state.xpFlyOrbs||[]).filter(o=>!o.done);
 for(const fx of state.impacts)fx.life-=dt;state.impacts=state.impacts.filter(fx=>fx.life>0);state.shake=Math.max(0,state.shake-dt*18);
 const kickDamp=Math.exp(-18*dt);state.camKickX=(state.camKickX||0)*kickDamp;state.camKickY=(state.camKickY||0)*kickDamp;
 const focusTarget=findCombatTarget();
 const targetPanX=clamp(((state.playerX-86)*.22)+(state.heroLunge||0)*.9+(focusTarget?(focusTarget.x-310)*.09:0)+(state.clawMode==="idle"?(state.clawX-225)*.025:0),-18,18);
 const targetPanY=clamp((state.playerAction==="special"?-5:state.playerHit>0?4:0),-8,8);
 const panFollow=1-Math.exp(-8*dt);
 state.camPanX=(state.camPanX||0)+(targetPanX-(state.camPanX||0))*panFollow;
 state.camPanY=(state.camPanY||0)+(targetPanY-(state.camPanY||0))*panFollow;
 for(const f of state.floaters){f.x+=(f.vx||0)*dt;f.y+=(f.vy!==undefined?f.vy:-22)*dt;if(f.vy!==undefined)f.vy+=42*dt;f.life-=dt}state.floaters=state.floaters.filter(f=>f.life>0);
 if(state.clawMode==="down"){
  state.clawY=Math.min(668,state.clawY+430*dt);
  if(state.clawY>=668){
   const hit=getClawTargetCandidate();
   const nearest=hit?hit.p:null;
   if(nearest){
    state.grabbed=nearest;state.machinePrizes=state.machinePrizes.filter(p=>p.id!==nearest.id);
    impulseChamber(44,state.clawX);
    if(state.effects&&nearest.type!=="ball"){for(let i=0;i<8;i++)particle(state.clawX+rand(-8,8),656+rand(-8,8),pick(["#7ef8ea","#ffd36d","#ffffff"]),rand(1.6,3.1))}
    notify(nearest.type==="ball"?"ZŁAPANO ZWYKŁĄ KULKĘ • BEZ BONUSU":"ZŁAPANO ŁUP • "+prizeLabel(nearest.type));beep(nearest.type==="ball"?360:760,.12,"triangle");
   }else{state.grabbed=null;state.clawCombo=0;state.clawEmpowered=0;impulseChamber(30,state.clawX);notify("PUSTY CHWYT • CELOWANIE MA ZNACZENIE");playSfx("clawMiss")}
   state.clawMode="grab";state.clawGripDelay=.17;
  }
 }else if(state.clawMode==="grab"){
  state.clawGripDelay=Math.max(0,state.clawGripDelay-dt);
  if(state.clawGripDelay<=0)state.clawMode="return";
 }else if(state.clawMode==="return"){
  state.clawY=Math.max(560,state.clawY-620*dt);
  if(state.clawY<=560){
   state.clawMode="idle";if(state.grabbed)reward(state.grabbed.type,state.grabbed);state.grabbed=null;
   state.turnPhase="hero";state.turn="player";notify("FAZA 2/2 • RUCH TAKTYCZNY I AKCJA");
  }
 }
 for(const star of state.stars){star.y+=star.v*dt;if(star.y>500)star.y=85}
 state.enemies=state.enemies.filter(e=>!e.dying||e.deathTimer>0);
 if(state.turnPhase==="transition"&&state.enemies.length===0)checkEncounterClear();
}
