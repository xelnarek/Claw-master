<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101b35">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Claw Quest — kolorowa gra arcade 2D z walką i automatem z chwytakiem.">
<title>Claw Quest — Arcade Roguelite</title>
<style>
:root{color-scheme:dark;--ink:#f7f4ff;--muted:#aab3d0;--panel:#172541;--line:rgba(255,255,255,.13);--gold:#ffcc5c;--cyan:#5ce4e8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091326;font-family:Inter,ui-rounded,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#283d6b 0%,#101b35 52%,#07101f 100%)}
#game-wrap{position:relative;width:min(100vw,56.25dvh);height:min(100dvh,177.78vw);max-width:520px;max-height:925px;overflow:hidden;border-radius:20px;background:#121f3b;box-shadow:0 20px 80px #0009,inset 0 0 0 1px #ffffff20}
canvas{display:block;width:100%;height:100%;touch-action:none}
#toast{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) scale(.95);opacity:0;pointer-events:none;padding:11px 17px;border:1px solid #ffffff35;border-radius:16px;background:#111c33ee;color:white;font-size:13px;font-weight:900;letter-spacing:.05em;white-space:nowrap;box-shadow:0 12px 32px #0008;transition:.18s}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#hint{position:absolute;bottom:7px;left:0;right:0;text-align:center;color:#c9d4ef88;font-size:9px;letter-spacing:.08em;pointer-events:none}
@media(min-aspect-ratio:7/10){#game-wrap{border-radius:15px}}
</style>
</head>
<body>
<main id="game-wrap" aria-label="Claw Master Arcade Quest">
<canvas id="game" width="450" height="800" aria-label="Gra Claw Master Arcade Quest"></canvas>
<div id="toast" role="status"></div>
<div id="hint">TUROWA WALKA • J ATAK • K OBRONA • L SUPER • CHWYTAK NA DOLE</div>
</main>
<script>
(() => {
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=450,H=800,toastEl=document.getElementById("toast");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const state={
 started:false,paused:false,over:false,sound:false,
 time:0,last:0,spawn:0,shot:0,turn:"player",turnTimer:0,defending:false,selectedEnemy:0,clawMode:"idle",clawY:565,clawX:310,clawTimer:0,grabbed:null,
 wave:1,kills:0,score:0,coins:0,hp:100,maxHp:100,damage:1,shield:0,
 playerX:86,playerY:408,playerHit:0,flash:0,
 enemies:[],bullets:[],particles:[],loot:[],stars:[],floaters:[],
 toastTimer:0,screen:"title",bossSpawned:false
};
const COLORS={navy:"#111d39",deep:"#0b1530",panel:"#1a2a4b",cyan:"#57e5e8",gold:"#ffd166",orange:"#ff8b55",pink:"#ff6ba8",violet:"#9d82ff",green:"#7ce6a2"};
let audio=null;
function beep(freq=440,duration=.07,type="sine",volume=.035){
 if(!state.sound)return;
 try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=freq;g.gain.value=volume;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.stop(audio.currentTime+duration)}catch(e){}
}
function rounded(x,y,w,h,r,fill,stroke,lw=1){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}
}
function text(s,x,y,size=14,color="#fff",weight=800,align="left"){
 ctx.font=weight+" "+size+"px Inter,system-ui,sans-serif";ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function glow(x,y,r,color,alpha=.35){
 const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,"transparent");ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
}
function line(x1,y1,x2,y2,color,width=2){
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.stroke();
}
function pill(x,y,w,label,fill="#263a60",color="#fff"){
 rounded(x,y,w,25,12,fill,"#ffffff22");text(label,x+w/2,y+13,10,color,900,"center");
}
function button(x,y,w,h,label,sub,active=false){
 rounded(x,y+4,w,h,14,"#070e20aa");rounded(x,y,w,h,14,active?"#ffb84d":"#263b63",active?"#ffe7a2":"#7894c8",2);
 text(label,x+w/2,y+h*.43,15,active?"#37200b":"#f7f6ff",1000,"center");
 if(sub)text(sub,x+w/2,y+h*.75,8,active?"#5a3516":"#b9c9ec",800,"center");
}
function drawBackground(){
 const g=ctx.createLinearGradient(0,80,0,505);g.addColorStop(0,"#243e71");g.addColorStop(.55,"#2b6d77");g.addColorStop(1,"#193d4d");ctx.fillStyle=g;ctx.fillRect(0,75,W,430);
 glow(345,170,125,"#ffcf78",.24);
 // soft clouds
 for(let i=0;i<4;i++){const x=((i*137-state.time*5)%570+570)%570-60,y=135+(i%2)*54;ctx.globalAlpha=.13;ctx.fillStyle="#e5f5ff";ctx.beginPath();ctx.ellipse(x,y,38,11,0,0,Math.PI*2);ctx.ellipse(x+20,y-7,22,12,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 // distant hills
 ctx.fillStyle="#255b61";ctx.beginPath();ctx.moveTo(0,354);ctx.quadraticCurveTo(70,280,145,355);ctx.quadraticCurveTo(250,265,340,355);ctx.quadraticCurveTo(405,300,450,344);ctx.lineTo(450,505);ctx.lineTo(0,505);ctx.fill();
 // decorative trees
 for(let i=0;i<9;i++){const x=i*59-14;const h=65+(i*31)%65;ctx.fillStyle=i%2?"#174b50":"#1b5554";ctx.fillRect(x+16,365-h*.5,10,h*.7);ctx.beginPath();ctx.arc(x+21,360-h*.55,30+(i%3)*5,0,Math.PI*2);ctx.fill()}
 // arena floor
 const floor=ctx.createLinearGradient(0,405,0,505);floor.addColorStop(0,"#386b59");floor.addColorStop(1,"#1b3947");ctx.fillStyle=floor;ctx.fillRect(0,405,W,100);
 for(let i=0;i<18;i++){const x=i*29+(i%2)*8;ctx.fillStyle=i%2?"#9fbc8050":"#cce39a32";ctx.beginPath();ctx.ellipse(x,455+(i%3)*10,7,2,0,0,Math.PI*2);ctx.fill()}
 line(0,503,450,503,"#87d69b",3);
 // ambience motes
 for(const p of state.stars){ctx.globalAlpha=p.a;ctx.fillStyle="#fff4c6";ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
}
function drawHeader(){
 rounded(12,10,426,58,16,"#101b35eF","#ffffff20");
 // logo mark
 glow(35,38,25,"#56e2dd",.22);rounded(19,21,33,33,10,"#ffbd50","#ffe5a4",2);
 text("✦",35,38,20,"#493016",1000,"center");
 text("CLAW",62,28,16,"#fff",1000);text("QUEST",62,47,11,"#69e8e6",1000);
 pill(180,24,72,"FALA "+state.wave,"#243e66","#ffe08a");
 rounded(270,21,94,34,11,"#203554","#5474a9");text("◆ "+state.coins,317,38,13,"#ffdc77",1000,"center");
 // Sound and pause buttons
 rounded(374,20,28,28,9,"#2b4268","#7894c8");text(state.sound?"♫":"♪",388,34,15,"#fff",900,"center");
 rounded(408,20,28,28,9,"#2b4268","#7894c8");text(state.paused?"▶":"Ⅱ",422,34,12,"#fff",900,"center");
}
function drawHealth(){
 rounded(15,79,420,40,12,"#101a31dd","#ffffff19");
 text("♥",30,99,17,"#ff6f83",1000);
 rounded(48,89,235,18,9,"#3a4058");
 const pct=clamp(state.hp/state.maxHp,0,1);
 const gr=ctx.createLinearGradient(48,0,283,0);gr.addColorStop(0,"#ff6d80");gr.addColorStop(1,"#ffbb71");rounded(48,89,235*pct,18,9,gr);
 text(Math.ceil(state.hp)+" / "+state.maxHp,166,98,10,"#fff",900,"center");
 pill(295,86,58,"ATK "+state.damage,"#28395c","#8bf1e4");
 pill(360,86,75,"WYNIK "+state.score,"#28395c","#ffe08a");
}
function drawHero(x,y){
 ctx.save();ctx.translate(x,y);
 // shadow
 ctx.globalAlpha=.3;ctx.fillStyle="#07111f";ctx.beginPath();ctx.ellipse(0,8,29,8,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
 // cape
 ctx.fillStyle="#e65c74";ctx.beginPath();ctx.moveTo(-11,-37);ctx.quadraticCurveTo(-34,-24,-25,4);ctx.quadraticCurveTo(-7,-2,1,-27);ctx.fill();
 // legs and boots
 rounded(-16,-12,12,20,5,"#334d83");rounded(2,-12,12,20,5,"#334d83");
 rounded(-19,2,17,8,4,"#f2b75d");rounded(0,2,17,8,4,"#f2b75d");
 // body tunic
 ctx.fillStyle="#3977c7";ctx.beginPath();ctx.moveTo(-16,-39);ctx.quadraticCurveTo(0,-47,16,-39);ctx.lineTo(18,-10);ctx.quadraticCurveTo(0,-1,-18,-10);ctx.closePath();ctx.fill();rounded(-4,-33,8,23,3,"#e6b94f");
 // arms
 rounded(-23,-34,12,23,6,"#f3bc83");rounded(12,-34,12,23,6,"#f3bc83");
 // head
 ctx.fillStyle="#f2c18d";ctx.beginPath();ctx.arc(0,-49,17,0,Math.PI*2);ctx.fill();
 // hair + headband
 ctx.fillStyle="#5b382b";ctx.beginPath();ctx.arc(0,-55,17,Math.PI,Math.PI*2);ctx.lineTo(16,-49);ctx.quadraticCurveTo(5,-55,-15,-47);ctx.fill();
 rounded(-17,-59,34,7,4,"#ffd166");rounded(7,-57,13,4,2,"#f28b48");
 // eyes, smile
 ctx.fillStyle="#2b3552";ctx.beginPath();ctx.arc(6,-48,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(-5,-48,2,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle="#9b4e45";ctx.lineWidth=1.7;ctx.beginPath();ctx.arc(0,-43,5,.15,Math.PI-.15);ctx.stroke();
 // sword
 ctx.save();ctx.translate(23,-28);ctx.rotate(-.5);rounded(-3,-4,7,26,3,"#c8d8e9");ctx.fillStyle="#fff";ctx.beginPath();ctx.moveTo(-3,-4);ctx.lineTo(0,-20);ctx.lineTo(4,-4);ctx.fill();rounded(-8,0,17,5,2,"#ffcf66");rounded(-2,16,5,10,2,"#8a5839");ctx.restore();
 ctx.restore();
}
function drawEnemy(e){
 ctx.save();ctx.translate(e.x,e.y);
 const bob=Math.sin(state.time*5+e.phase)*3;ctx.translate(0,bob);
 if(e.type==="slime"){
  glow(0,-10,34,"#79f3bd",.15);
  const g=ctx.createLinearGradient(0,-42,0,6);g.addColorStop(0,"#b1ffd3");g.addColorStop(1,"#2bb88c");
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-23,0);ctx.quadraticCurveTo(-28,-18,-14,-35);ctx.quadraticCurveTo(0,-48,17,-32);ctx.quadraticCurveTo(28,-17,23,0);ctx.quadraticCurveTo(0,12,-23,0);ctx.fill();
  rounded(-13,-22,8,13,4,"#fff");rounded(6,-22,8,13,4,"#fff");
  rounded(-11,-18,4,7,2,"#163b50");rounded(8,-18,4,7,2,"#163b50");
  ctx.strokeStyle="#1d6b61";ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,-9,7,.2,Math.PI-.2);ctx.stroke();
 }else if(e.type==="bat"){
  ctx.fillStyle="#8069bd";ctx.beginPath();ctx.moveTo(-7,-12);ctx.quadraticCurveTo(-33,-44,-34,-12);ctx.quadraticCurveTo(-18,-9,-8,3);ctx.quadraticCurveTo(0,10,8,3);ctx.quadraticCurveTo(18,-9,34,-12);ctx.quadraticCurveTo(33,-44,7,-12);ctx.fill();
  ctx.fillStyle="#ba9cff";ctx.beginPath();ctx.ellipse(0,-12,16,18,0,0,Math.PI*2);ctx.fill();
  text("•", -6,-14,14,"#ffefb1",1000);text("•",6,-14,14,"#ffefb1",1000);
 }else if(e.type==="boss"){
  glow(0,-15,62,"#ff6b8f",.28);
  // horned guardian: deliberately larger than regular enemies
  ctx.fillStyle="#623f80";ctx.beginPath();ctx.moveTo(-28,-28);ctx.lineTo(-41,-53);ctx.quadraticCurveTo(-17,-49,-12,-36);ctx.quadraticCurveTo(0,-46,12,-36);ctx.quadraticCurveTo(25,-53,41,-53);ctx.lineTo(28,-20);ctx.closePath();ctx.fill();
  const bg=ctx.createLinearGradient(0,-47,0,18);bg.addColorStop(0,"#d67bd2");bg.addColorStop(1,"#743e9a");
  ctx.fillStyle=bg;ctx.beginPath();ctx.moveTo(-32,4);ctx.quadraticCurveTo(-38,-26,-24,-42);ctx.quadraticCurveTo(0,-57,24,-42);ctx.quadraticCurveTo(38,-26,32,4);ctx.quadraticCurveTo(0,22,-32,4);ctx.fill();ctx.strokeStyle="#f4b6ff";ctx.lineWidth=2;ctx.stroke();
  rounded(-20,-27,14,13,5,"#ffe8a1");rounded(6,-27,14,13,5,"#ffe8a1");
  rounded(-15,-24,6,8,2,"#7b254d");rounded(9,-24,6,8,2,"#7b254d");
  ctx.fillStyle="#54264f";ctx.beginPath();ctx.moveTo(-10,-4);ctx.lineTo(-5,5);ctx.lineTo(0,-3);ctx.lineTo(5,5);ctx.lineTo(10,-4);ctx.closePath();ctx.fill();
  rounded(-43,-51,86,7,3,"#251735");rounded(-43,-51,86*clamp(e.hp/e.maxHp,0,1),7,3,"#ff799c");
 }else{
  rounded(-21,-35,42,40,13,"#d68a58","#ffd0a0",2);rounded(-15,-28,12,15,4,"#fff2cf");rounded(3,-28,12,15,4,"#fff2cf");
  rounded(-11,-24,5,8,2,"#573b42");rounded(7,-24,5,8,2,"#573b42");
  text("⌁",0,-5,15,"#633d3e",1000,"center");
  rounded(-24,-42,48,9,5,"#7e4f44");rounded(-12,-49,24,9,4,"#ffcc63");
 }
 // regular enemy health bars
 if(e.type!=="boss"){rounded(-23,-54,46,5,3,"#15213d");rounded(-23,-54,46*clamp(e.hp/e.maxHp,0,1),5,3,"#ff7088");}
 ctx.restore();
}
function drawArena(){
 drawBackground();
 // top arena label
 pill(18,130,116,"LEŚNA POLANA","#16374e","#baf8dc");
 // glow portals in distance
 glow(405,365,48,"#d47fff",.14);
 // floor details and player
 drawHero(state.playerX,state.playerY);
 for(let i=0;i<state.enemies.length;i++){const e=state.enemies[i];drawEnemy(e);if(i===state.selectedEnemy){ctx.strokeStyle="#fff3a6";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(e.x,e.y-17,35,42,0,0,Math.PI*2);ctx.stroke();text("▼",e.x,e.y-69,14,"#fff3a6",1000,"center")}}
 for(const b of state.bullets){
  glow(b.x,b.y,18,"#79f5ff",.4);ctx.fillStyle="#b9ffff";ctx.beginPath();ctx.ellipse(b.x,b.y,8,4,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#58dfe3";ctx.lineWidth=2;ctx.stroke();
 }
 for(const p of state.particles){ctx.globalAlpha=p.life/p.max;glow(p.x,p.y,p.size*2,p.color,.3);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 for(const f of state.floaters){ctx.globalAlpha=clamp(f.life,0,1);text(f.label,f.x,f.y,12,f.color,1000,"center");ctx.globalAlpha=1}
 // strategic turn-based combat actions
 pill(18,432,110,state.turn==="player"?"TWOJA TURA":"TURA WROGA","#173653",state.turn==="player"?"#a8fff0":"#ffb2b2");
 button(137,435,88,48,"ATAK","",state.turn==="player");
 button(231,435,88,48,"OBRONA","",state.turn==="player");
 button(325,435,105,48,"UMIEJĘT.",""+(state.skillReady?"GOTOWA":"ŁADUJE"),state.turn==="player"&&state.skillReady);
}
function drawPrize(type,x,y,scale=1){
 ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);
 if(type==="coin"){glow(0,0,24,"#ffd95e",.34);ctx.fillStyle="#f9b938";ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.strokeStyle="#fff0a8";ctx.lineWidth=3;ctx.stroke();text("C",0,1,12,"#8d541d",1000,"center")}
 if(type==="gem"){glow(0,0,28,"#5ce5ee",.35);ctx.fillStyle="#53dce6";ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(14,-5);ctx.lineTo(9,13);ctx.lineTo(-9,13);ctx.lineTo(-14,-5);ctx.closePath();ctx.fill();ctx.strokeStyle="#d9ffff";ctx.lineWidth=2;ctx.stroke();line(0,-14,0,11,"#ffffff99",2)}
 if(type==="heart"){glow(0,0,25,"#ff7299",.32);ctx.fillStyle="#ff668c";ctx.beginPath();ctx.moveTo(0,13);ctx.bezierCurveTo(-27,-3,-15,-20,0,-9);ctx.bezierCurveTo(15,-20,27,-3,0,13);ctx.fill();ctx.strokeStyle="#ffd5df";ctx.lineWidth=2;ctx.stroke()}
 if(type==="star"){glow(0,0,26,"#ffcc59",.38);ctx.fillStyle="#ffce62";ctx.strokeStyle="#fff3ba";ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,r=i%2?7:16;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r)}ctx.closePath();ctx.fill();ctx.stroke()}
 if(type==="bomb"){glow(0,0,24,"#ff845e",.32);ctx.fillStyle="#626d94";ctx.beginPath();ctx.arc(0,2,12,0,Math.PI*2);ctx.fill();line(4,-9,10,-17,"#ffbd66",3);ctx.fillStyle="#ffe28c";ctx.beginPath();ctx.arc(12,-19,3,0,Math.PI*2);ctx.fill()}
 ctx.restore();
}
function drawClawMachine(){
 // cabinet frame
 rounded(12,503,426,283,23,"#0d1830","#6278a5",3);
 rounded(20,511,410,266,17,"#182849","#3b5b8b",2);
 const glass=ctx.createLinearGradient(0,516,0,755);glass.addColorStop(0,"#1e4667");glass.addColorStop(.75,"#162b4b");glass.addColorStop(1,"#25365d");rounded(27,518,396,230,13,glass,"#84ddec55",2);
 // backlight / stars
 glow(100,598,120,"#40bfe0",.13);glow(355,630,110,"#ae71ff",.12);
 for(let i=0;i<21;i++){const x=42+(i*71)%370,y=535+(i*43)%181;ctx.globalAlpha=.3;ctx.fillStyle="#c7f7ff";ctx.beginPath();ctx.arc(x,y,1.1+(i%3),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1}
 // top rail
 rounded(41,529,368,12,6,"#b1c9e5","#f2fbff",1);rounded(state.clawX-19,524,38,21,7,"#ffca62","#fff0ac",2);
 // claw wire
 line(state.clawX,545,state.clawX,state.clawY-22,"#d3e2f1",3);
 // clamp body
 rounded(state.clawX-12,state.clawY-25,24,18,7,"#dce9f5","#ffffff",2);
 ctx.strokeStyle="#dce9f5";ctx.lineWidth=5;ctx.lineCap="round";
 const spread=state.clawMode==="down"?22:state.clawMode==="return"?7:19;
 ctx.beginPath();ctx.moveTo(state.clawX-6,state.clawY-10);ctx.lineTo(state.clawX-spread,state.clawY+9);ctx.stroke();
 ctx.beginPath();ctx.moveTo(state.clawX+6,state.clawY-10);ctx.lineTo(state.clawX+spread,state.clawY+9);ctx.stroke();
 // prizes in machine, bounce slightly
 const prizes=[{type:"coin",x:62},{type:"gem",x:128},{type:"star",x:194},{type:"heart",x:260},{type:"bomb",x:326},{type:"gem",x:392}];
 for(const p of prizes){const caught=state.grabbed&&state.grabbed.x===p.x; if(!caught)drawPrize(p.type,p.x,704+Math.sin(state.time*3+p.x)*2,.9)}
 if(state.grabbed&&state.clawMode==="return")drawPrize(state.grabbed.type,state.clawX,state.clawY+15,.72);
 // floor tray
 rounded(35,735,380,15,6,"#0c1428","#6983ad",1);
 // bottom console
 rounded(31,753,388,26,10,"#23375e","#7893c1",1);
 text("STEROWANIE CHWYTAKIEM • ŁUPY",225,766,9,"#a9c8eb",900,"center");
 // controls under cabinet
 button(34,680,47,43,"◀","LEWO",false);
 button(91,680,47,43,"▶","PRAWO",false);
 button(299,680,116,43,state.clawMode==="idle"?"ZŁAP!":"...",state.clawMode==="idle"?"CHWYĆ NAGRODĘ":"CHWYTAK",state.clawMode==="idle");
 // status ribbon
 pill(164,684,123,state.clawMode==="idle"?"USTAW I ZŁAP":"CHWYTAK W RUCHU","#10213e",state.clawMode==="idle"?"#a8f8ea":"#ffe39b");
}
function drawOverlay(){
 if(state.screen==="title"){
  ctx.fillStyle="#071226c9";ctx.fillRect(0,0,W,H);
  glow(225,330,170,"#4acbd3",.18);
  rounded(32,206,386,302,26,"#182a4beb","#85e5e6",2);
  text("CLAW QUEST",225,255,30,"#fff",1000,"center");
  text("ARCADE QUEST",225,286,15,"#70e7e7",1000,"center");
  // hero emblem
  glow(225,355,70,"#ffd166",.25);drawHero(225,389);
  text("WALCZ • ZBIERAJ • ROZWIJAJ",225,441,12,"#dce8ff",900,"center");
  button(101,462,248,46,"ROZPOCZNIJ GRĘ","DOTKNIJ, ABY WEJŚĆ DO AKCJI",true);
 }
 if(state.paused&&state.screen==="game"){
  ctx.fillStyle="#071226bb";ctx.fillRect(0,0,W,H);rounded(55,315,340,145,22,"#192b4b","#7b98ca",2);
  text("PAUZA",225,350,24,"#fff",1000,"center");button(125,382,200,48,"WRÓĆ DO GRY","",true);
 }
 if(state.over){
  ctx.fillStyle="#071226cc";ctx.fillRect(0,0,W,H);rounded(42,280,366,228,24,"#1a2a49","#ffbc62",2);
  text("KONIEC WYPRAWY",225,322,23,"#fff",1000,"center");
  text("WYNIK  "+state.score,225,366,17,"#ffdc7a",1000,"center");
  text("POKONANI WROGOWIE: "+state.kills,225,395,11,"#dce7ff",900,"center");
  button(112,430,226,51,"ZAGRAJ PONOWNIE","",true);
 }
}
function draw(){
 ctx.clearRect(0,0,W,H);
 drawHeader();drawHealth();drawArena();drawClawMachine();drawOverlay();
}
function spawnEnemy(){
 const wave=state.wave;const boss=wave%5===0&&!state.bossSpawned;
 const type=boss?"boss":pick(["slime","slime","bat","goblin"]);
 const max=boss?32+wave*4:10+Math.floor(wave*1.6);
 state.enemies.push({x:boss?345:rand(245,405),y:boss?365:rand(360,395),type,hp:max,maxHp:max,speed:(boss?10:rand(17,28))+wave*1.1,damage:boss?22:6+wave,phase:rand(0,6),hit:0});
 if(boss){state.bossSpawned=true;notify("POJAWIA SIĘ STRAŻNIK!");beep(115,.22,"sawtooth")}
}
function particle(x,y,color,size=3){
 state.particles.push({x,y,vx:rand(-60,60),vy:rand(-85,40),life:rand(.3,.7),max:.7,color,size});
}
function popText(label,x,y,color="#fff"){state.floaters.push({label,x,y,life:1,color})}
function defeat(e){
 state.kills++;state.score+=e.type==="boss"?250:20;
 const reward=e.type==="boss"?8:1;state.coins+=reward;
 for(let i=0;i<14;i++)particle(e.x,e.y,pick(["#7df6d1","#ffd166","#ff79a8","#a58dff"]),rand(2,5));
 popText(e.type==="boss"?"+250  BOSS!":"+20",e.x,e.y-28,"#ffe18a");
 if(e.type==="boss"){state.wave++;state.bossSpawned=false;state.hp=Math.min(state.maxHp,state.hp+18);notify("BOSS POKONANY • +18 HP");}
 if(e.type!=="boss"&&state.kills>0&&state.kills%8===0){state.wave++;notify("NOWA FALA "+state.wave);state.damage++;state.hp=Math.min(state.maxHp,state.hp+8)}
 beep(680,.09,"triangle");
}
function reward(type){
 if(type==="coin"){state.coins+=5;state.score+=30;popText("+5 MONET",225,633,"#ffdf79")}
 if(type==="gem"){state.damage++;state.score+=50;popText("ATAK +1",225,633,"#80fff0")}
 if(type==="heart"){state.hp=Math.min(state.maxHp,state.hp+28);state.score+=20;popText("+28 ŻYCIA",225,633,"#ff8eae")}
 if(type==="star"){state.shield=5;state.score+=40;popText("TARCZA 5 s",225,633,"#ffe18a")}
 if(type==="bomb"){for(const e of state.enemies)e.hp-=5;state.score+=40;popText("BOMBA!",225,633,"#ffad82")}
 beep(900,.12,"sine");
}
function enemyName(e){return e?.type==="boss"?"Strażnik":e?.type==="bat"?"Nietoperz":e?.type==="slime"?"Szlam":"Goblin"}
function combatAttack(){
 if(state.turn!=="player"||!state.started||state.over||!state.enemies.length)return;
 const e=state.enemies[state.selectedEnemy]||state.enemies[0];
 const dmg=state.damage+(e.type==="bat"?1:0);
 e.hp-=dmg;e.hit=.2;state.playerHit=.15;
 for(let i=0;i<7;i++)particle(e.x,e.y,"#ffdd91",rand(2,4));
 popText("-"+dmg,e.x,e.y-45,"#ffe38b");state.score+=5;
 state.turn="enemy";state.turnTimer=.65;state.defending=false;beep(540,.1,"square");
}
function combatDefend(){
 if(state.turn!=="player"||!state.started||state.over)return;
 state.defending=true;state.turn="enemy";state.turnTimer=.65;popText("OBRONA",state.playerX,state.playerY-70,"#a9e9ff");beep(260,.1,"triangle");
}
function combatSkill(){
 if(state.turn!=="player"||!state.started||state.over||!state.skillReady)return;
 const e=state.enemies[state.selectedEnemy]||state.enemies[0];if(!e)return;
 const dmg=state.damage*3+4;e.hp-=dmg;state.skillReady=false;
 state.playerHit=.25;for(let i=0;i<18;i++)particle(e.x,e.y,pick(["#a7ffff","#ffdb78","#ff9bbd"]),rand(3,6));
 popText("SUPER -"+dmg,e.x,e.y-48,"#ffb8ff");notify("MOCNY CIOS!");state.turn="enemy";state.turnTimer=.85;state.defending=false;beep(880,.15,"sawtooth");
 setTimeout(()=>{state.skillReady=true},4500);
}
function resolveEnemyTurn(){
 if(state.turn!=="enemy")return;
 if(state.enemies.length){
  const target=state.enemies.reduce((a,b)=>a.x>b.x?a:b);
  const raw=target.type==="boss"?Math.ceil(target.damage/3):target.damage;
  const dmg=state.defending?Math.max(1,Math.ceil(raw*.35)):raw;
  if(state.shield>0){state.shield=Math.max(0,state.shield-dmg);popText("TARCZA",state.playerX,state.playerY-65,"#83f6e9")}
  else {state.hp=Math.max(0,state.hp-dmg);popText("-"+dmg,state.playerX,state.playerY-65,"#ff8d9e");state.playerHit=.2;beep(170,.12,"sawtooth")}
  if(target.type==="boss"&&Math.random()<.3&&!state.defending){state.hp=Math.max(0,state.hp-4);popText("MOC BOSS +4",state.playerX,state.playerY-90,"#ff9cbd")}
 }
 state.defending=false;state.turn="player";state.selectedEnemy=clamp(state.selectedEnemy,0,Math.max(0,state.enemies.length-1));notify("TWOJA TURA");
}
function deployClaw(){
 if(!state.started||state.over||state.paused||state.clawMode!=="idle")return;
 state.clawMode="down";state.clawTimer=0;state.grabbed=null;beep(310,.08,"triangle");
}
function moveClaw(dir){if(state.clawMode==="idle"){state.clawX=clamp(state.clawX+dir*23,54,396);beep(230,.03,"square",.015)}}
function notify(msg){toastEl.textContent=msg;toastEl.classList.add("show");state.toastTimer=1.35}
function reset(){
 state.started=true;state.paused=false;state.over=false;state.screen="game";state.time=0;state.spawn=0;state.shot=0;state.turn="player";state.turnTimer=0;state.defending=false;state.selectedEnemy=0;state.skillReady=true;state.wave=1;state.kills=0;state.score=0;state.coins=0;state.hp=100;state.maxHp=100;state.damage=1;state.shield=0;state.playerX=86;state.enemies=[];state.bullets=[];state.particles=[];state.floaters=[];state.clawMode="idle";state.clawX=310;state.clawY=565;state.grabbed=null;state.bossSpawned=false;notify("WYPRAWA ROZPOCZĘTA!");
}
function interact(x,y){
 if(state.screen==="title"){if(x>70&&x<380&&y>430&&y<530){reset()}else reset();return}
 if(state.over){if(y>400&&y<510)reset();return}
 if(state.paused){state.paused=false;return}
 if(y<60&&x>400){state.paused=true;return}
 if(y<60&&x>365){state.sound=!state.sound;beep(520,.05);return}
 if(y>435&&y<490){if(x<225)combatAttack();else if(x<320)combatDefend();else combatSkill();return}
 if(y>675&&y<735){if(x<85)moveClaw(-1);else if(x<150)moveClaw(1);else if(x>285)deployClaw();return}
 if(y>=500&&y<=675){moveClaw(x<state.clawX?-1:1);return}
 if(y>330&&y<430&&state.turn==="player"&&state.enemies.length){let near=0,best=1e9;state.enemies.forEach((en,i)=>{let d=Math.abs(en.x-x)+Math.abs(en.y-y);if(d<best){best=d;near=i}});if(best<110){state.selectedEnemy=near;notify("CEL: "+enemyName(state.enemies[near]));}}
}
let pointerStart=null;
canvas.addEventListener("pointerdown",e=>{
 const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 pointerStart={x,y,id:e.pointerId};canvas.setPointerCapture(e.pointerId);interact(x,y);
});
canvas.addEventListener("pointermove",e=>{
 if(!pointerStart||state.clawMode!=="idle")return;
 if(e.pointerType==="touch"&&pointerStart.y>500&&pointerStart.y<675){const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;state.clawX=clamp(x,54,396)}
});
canvas.addEventListener("pointerup",()=>{pointerStart=null});
window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," ","a","d","A","D","f","F","Escape"].includes(e.key))e.preventDefault();
 if(e.key==="Escape"){state.paused=!state.paused;return}
 if(state.screen==="title"){reset();return}
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveClaw(-1);
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveClaw(1);
 if(e.key===" "||e.key.toLowerCase()==="f")deployClaw();
 if(e.key.toLowerCase()==="j")combatAttack();if(e.key.toLowerCase()==="k")combatDefend();if(e.key.toLowerCase()==="l")combatSkill();
});
function update(dt){
 state.time+=dt;
 if(state.toastTimer>0){state.toastTimer-=dt;if(state.toastTimer<=0)toastEl.classList.remove("show")}
 if(state.screen!=="game"||state.paused||state.over)return;
 // visual-only idle movement of enemy bodies; actions are resolved in discrete turns.
 for(const e of state.enemies){e.phase+=dt*2;if(e.hit>0)e.hit-=dt}
 if(state.turn==="enemy"){state.turnTimer-=dt;if(state.turnTimer<=0)resolveEnemyTurn()}
 const alive=[];for(const e of state.enemies){if(e.hp<=0)defeat(e);else alive.push(e)}state.enemies=alive;
 if(!state.enemies.length&&state.turn==="player"&&!state.over){state.wave++;state.spawn=0;state.bossSpawned=false;state.damage+=state.wave>1?0:0;for(let i=0;i<Math.min(3+Math.floor(state.wave/2),5);i++)spawnEnemy();state.selectedEnemy=0;notify("FALA "+state.wave+" • NOWI WROGOWIE");}
 if(state.hp<=0){state.hp=0;state.over=true;return}
 if(state.playerHit>0)state.playerHit-=dt;
 if(state.shield>0)state.shield-=dt;
 for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt}
 state.particles=state.particles.filter(p=>p.life>0);
 for(const f of state.floaters){f.y-=22*dt;f.life-=dt}
 state.floaters=state.floaters.filter(f=>f.life>0);
 if(state.clawMode==="down"){
  state.clawY=Math.min(713,state.clawY+250*dt);
  if(state.clawY>=700){const options=[{type:"coin",x:62},{type:"gem",x:128},{type:"star",x:194},{type:"heart",x:260},{type:"bomb",x:326},{type:"gem",x:392}];const nearest=options.reduce((a,b)=>Math.abs(b.x-state.clawX)<Math.abs(a.x-state.clawX)?b:a);if(Math.abs(nearest.x-state.clawX)<42){state.grabbed=nearest;state.clawMode="return";notify("ZŁAPANO NAGRODĘ!");beep(760,.12,"triangle")}else{state.clawMode="return";notify("PUSTY CHWYT!");beep(180,.12,"triangle")}}
 }else if(state.clawMode==="return"){
  state.clawY=Math.max(565,state.clawY-280*dt);
  if(state.clawY<=565){state.clawMode="idle";if(state.grabbed)reward(state.grabbed.type);state.grabbed=null}
 }
 for(const s of state.stars){s.y+=s.v*dt;if(s.y>500)s.y=85}
}
function frame(ts){
 const dt=Math.min(.033,(ts-state.last)/1000||0);state.last=ts;
 update(dt);draw();requestAnimationFrame(frame);
}
for(let i=0;i<30;i++)state.stars.push({x:rand(5,W-5),y:rand(90,490),r:rand(.6,1.8),a:rand(.15,.55),v:rand(4,16)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state.screen==="game")state.paused=true});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
draw();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
