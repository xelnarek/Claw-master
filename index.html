<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101b35">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Claw Quest — turowy roguelite: jeden chwyt łupów, jedna akcja bohatera i odpowiedź przeciwników.">
<title>Claw Quest — Turn-Based Roguelite</title>
<style>
:root{color-scheme:dark;--ink:#fff8eb;--muted:#aebbd5;--panel:#172541;--line:rgba(255,255,255,.16);--gold:#ffd166;--cyan:#67e8e5;--navy:#101a34;--blue:#29466f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#091326;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
body{display:block;background:#091326}
/* Pełnoekranowy układ mobilny: żadnych pustych pasów nad/pod grą na ekranach 19.5:9–21:9. */
#game-wrap{position:fixed;inset:0;width:100vw;height:100dvh;max-width:none;max-height:none;overflow:hidden;border-radius:0;background:#101b35;box-shadow:none;isolation:isolate}
canvas{display:block;width:100%;height:100%;touch-action:none}
@supports(height:100svh){#game-wrap{height:100svh}}
@media(min-width:700px) and (min-height:900px){#game-wrap{width:min(100vw,62.5dvh);height:min(100dvh,160vw);left:50%;top:50%;transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 24px 90px #000b,0 0 0 1px #ffffff24}}
#toast{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%) scale(.95);opacity:0;pointer-events:none;padding:11px 17px;border:1px solid #ffffff35;border-radius:16px;background:#111c33ee;color:white;font-size:13px;font-weight:900;letter-spacing:.05em;white-space:nowrap;box-shadow:0 12px 32px #0008;transition:.18s}
#toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#hint{position:absolute;bottom:7px;left:0;right:0;text-align:center;color:#c9d4ef88;font-size:9px;letter-spacing:.08em;pointer-events:none}
@media(max-height:520px){#hint{font-size:8px;bottom:2px}}
</style>
</head>
<body>
<main id="game-wrap" aria-label="Claw Master Arcade Quest">
<canvas id="game" width="450" height="800" aria-label="Gra Claw Master Arcade Quest"></canvas>
<div id="toast" role="status"></div>
<div id="hint">TURA: CHWYTAK → JEDNA AKCJA BOHATERA → PRZECIWNICY • A/D LUB ←/→ USTAW PAZUR • SPACJA ZŁAP</div>
</main>
<script>
(() => {
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=450,H=800,toastEl=document.getElementById("toast");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function resizeCanvas(){
 const rect=canvas.getBoundingClientRect(),dpr=clamp(Number(window.devicePixelRatio)||1,1,2);
 const width=Math.max(1,Math.round((rect.width||W)*dpr)),height=Math.max(1,Math.round((rect.height||H)*dpr));
 if(canvas.width!==width)canvas.width=width;
 if(canvas.height!==height)canvas.height=height;
 ctx.setTransform(width/W,0,0,height/H,0,0);
}
window.addEventListener("resize",resizeCanvas,{passive:true});
resizeCanvas();
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const state={
 started:false,paused:false,over:false,sound:false,clawUsedThisTurn:false,machinePrizes:[],poisonTurns:0,poisonDamage:2,
 time:0,last:0,shot:0,turn:"player",turnPhase:"claw",turnNumber:1,defending:false,selectedEnemy:0,clawMode:"idle",clawY:565,clawX:225,grabbed:null,heroActionUsedThisTurn:false,
 wave:1,kills:0,score:0,coins:0,hp:100,maxHp:100,damage:1,shield:0,weaponId:"sidearm",weaponLevel:1,guardTurns:0,skillCooldownTurns:0,prizeRefreshTimer:0,
 playerX:86,playerY:408,playerHit:0,flash:0,playerAction:"idle",playerActionTimer:0,playerActionDuration:.42,
 enemies:[],bullets:[],particles:[],loot:[],impacts:[],attackFx:null,shake:0,stars:[],floaters:[],skillReady:true,levelChoices:null,pendingLevelUps:0,runSkills:{},runCrit:0,runClawBonus:0,runSkillBonus:0,runHealOnKill:0,runLootBonus:0,runVenom:0,runBleed:0,runWard:0,runCounterBonus:0,
 stage:1,stageWave:0,stageCleared:false,stageReward:0,stageXp:0,runDamageBonus:0,threatEnemy:null,upgradesOpen:false,

};
const COLORS={navy:"#111d39",deep:"#0b1530",panel:"#1a2a4b",cyan:"#57e5e8",gold:"#ffd166",orange:"#ff8b55",pink:"#ff6ba8",violet:"#9d82ff",green:"#7ce6a2"};

 {id:"sidearm",name:"Pistolet serwisowy",rate:.72,damage:5,speed:470,color:"#ffd36d",pellets:1,spread:.025,radius:4},
 {id:"repeater",name:"Karabinek impulsowy",rate:.29,damage:2.7,speed:560,color:"#79eaff",pellets:1,spread:.012,radius:3.2},
 {id:"scatter",name:"Rozrzutnik",rate:1.02,damage:3.3,speed:390,color:"#ff9a69",pellets:3,spread:.19,radius:4.4},
 {id:"cannon",name:"Działo oblężnicze",rate:1.12,damage:10,speed:300,color:"#ffbd72",pellets:1,spread:.018,radius:7,splash:48},
 {id:"laser",name:"Lanca fotonowa",rate:.66,damage:7,speed:780,color:"#b6faff",pellets:1,spread:0,radius:3.5,pierce:1}
];
const weaponForRun=()=>weaponCatalog.find(w=>w.id===state.weaponId)||weaponCatalog[0];
const currentWeaponDamage=()=>Math.ceil((weaponForRun().damage+profile.attackRank+state.runDamageBonus)*(1+(state.weaponLevel-1)*.18));
const stageCatalog=[
 {title:"Polana Początku",biome:"meadow",objective:"W każdej turze: jeden chwyt, jedna akcja bohatera, potem ruch przeciwników.",waves:[["slime"],["slime","slime"]],coins:20,xp:18},
 {title:"Zarośnięta Ścieżka",biome:"forest",objective:"Najpierw łup z automatu, potem wybierz cel i jedną akcję.",waves:[["slime","slime"],["slime","bat"]],coins:28,xp:26},
 {title:"Nora Zmierzchu",biome:"cave",objective:"Kolczasty przeciwnik kontratakuje mocno — rozważ blok.",waves:[["bat","slime"],["porcupine","slime","bat"]],coins:38,xp:34},
 {title:"Ruiny Strażników",biome:"ruins",objective:"Czytaj zamiary wrogów i ustawiaj priorytet celu.",waves:[["goblin","goblin","bat"],["porcupine","goblin","slime"]],coins:50,xp:42},
 {title:"Leśny Strażnik",biome:"boss",objective:"Strażnik zapowiada silne ciosy — wykorzystaj łup i umiejętność.",waves:[["boss","porcupine"]],coins:85,xp:70}
];
const starterProfile=()=>({coins:0,xp:0,level:1,attackRank:0,vitalityRank:0,clawRank:0,unlockedStage:1,bestStage:1,bestScore:0});
function loadProfile(){try{const raw=localStorage.getItem(PROFILE_KEY);if(!raw)return starterProfile();const data=JSON.parse(raw),base=starterProfile();for(const key of Object.keys(base)){const value=Number(data?.[key]);base[key]=Number.isFinite(value)?Math.max(0,Math.floor(value)):base[key]}base.level=Math.max(1,base.level);base.unlockedStage=Math.max(1,Math.min(99,base.unlockedStage));return base}catch(e){return starterProfile()}}
let profile=loadProfile();
function saveProfile(){try{localStorage.setItem(PROFILE_KEY,JSON.stringify(profile));return true}catch(e){return false}}
function stageDefinition(stage=state.stage){if(stage<=stageCatalog.length)return stageCatalog[Math.max(0,stage-1)];const n=stage-stageCatalog.length;return {title:"Dzika Knieja "+n,biome:n%3===0?"ruins":n%3===1?"forest":"cave",objective:"Przetrwaj kolejne fale i zbieraj łupy.",waves:[["slime","bat","goblin"],["porcupine","goblin","bat"],["porcupine","goblin","slime","bat"]],coins:55+n*8,xp:45+n*5}}
function gainCoins(amount){const n=Math.max(0,Math.floor(amount));profile.coins+=n;state.coins=profile.coins;saveProfile();return n}
const abilityPool=[
 {id:"edge",name:"Ostrze runiczne",tag:"ATAK",desc:"+2 do obrażeń każdego ataku",color:"#ffb65c",max:4},
 {id:"vital",name:"Serce olbrzyma",tag:"ŻYWOTNOŚĆ",desc:"+20 maks. HP i natychmiastowe leczenie",color:"#ff7798",max:4},
 {id:"bulwark",name:"Aegis",tag:"OBRONA",desc:"+18 punktów tarczy",color:"#71dfff",max:4},
 {id:"execution",name:"Precyzyjne cięcie",tag:"KRYTYK",desc:"+8% szansy na podwójne obrażenia",color:"#f6db7b",max:5},
 {id:"reaper",name:"Głód łowcy",tag:"REGENERACJA",desc:"Odzyskaj 3 HP za pokonanego wroga",color:"#8de6a8",max:4},
 {id:"storm",name:"Burza eteru",tag:"SUPER",desc:"+4 obrażenia superataku",color:"#b69aff",max:4},
 {id:"claw",name:"Magnes skarbów",tag:"CHWYTAK",desc:"+12 px tolerancji chwytu",color:"#72e8dd",max:4},
 {id:"fortune",name:"Złoty instynkt",tag:"ŁUP",desc:"+50% monet z chwytaka",color:"#ffd36c",max:3},
 {id:"venom",name:"Zatruty sztych",tag:"DOT",desc:"Każdy atak dodaje 2 obrażenia",color:"#a5e477",max:4},
 {id:"bleed",name:"Krwawy znak",tag:"KRWAWIENIE",desc:"Ataki krwawią przez 2 fazy wrogów",color:"#ff8194",max:3},
 {id:"ward",name:"Żelazna przysięga",tag:"TARCZA",desc:"Odnów 2 pkt. tarczy na początku tury",color:"#9fc9ff",max:4},
 {id:"riposte",name:"Runa riposty",tag:"KONTRATAK",desc:"+2 obrażeń w kontrataku",color:"#82e5f2",max:4}
];
function rollAbilityChoices(){const available=abilityPool.filter(a=>(state.runSkills[a.id]||0)<a.max),pool=[...available],choices=[];while(pool.length&&choices.length<3){const i=Math.floor(Math.random()*pool.length);choices.push(pool.splice(i,1)[0])}if(!choices.length){state.pendingLevelUps=0;state.levelChoices=null;notify("WSZYSTKIE UMIEJĘTNOŚCI MAKSYMALNE");return}state.levelChoices=choices;beep(740,.14,"sine",.045);notify("AWANS! WYBIERZ JEDNĄ UMIEJĘTNOŚĆ")}
function chooseAbility(index){
 if(!state.levelChoices||!state.levelChoices[index])return false;
 const a=state.levelChoices[index];state.runSkills[a.id]=(state.runSkills[a.id]||0)+1;
 if(a.id==="edge")state.runDamageBonus+=2;
 if(a.id==="vital"){state.maxHp+=20;state.hp=Math.min(state.maxHp,state.hp+20)}
 if(a.id==="bulwark")state.shield+=18;
 if(a.id==="execution")state.runCrit+=.08;
 if(a.id==="reaper")state.runHealOnKill+=3;
 if(a.id==="storm")state.runSkillBonus+=4;
 if(a.id==="claw")state.runClawBonus+=12;
 if(a.id==="fortune")state.runLootBonus+=.5;
 if(a.id==="venom")state.runVenom+=2;
 if(a.id==="bleed")state.runBleed+=1;
 if(a.id==="ward")state.runWard+=1;
 if(a.id==="riposte")state.runCounterBonus+=2;
 state.damage=effectiveDamage();state.pendingLevelUps=Math.max(0,state.pendingLevelUps-1);state.levelChoices=null;
 beep(980,.1,"triangle",.05);if(state.pendingLevelUps>0)rollAbilityChoices();else notify(a.name.toUpperCase()+" • WYBRANO");return true;
}
function gainXp(amount){profile.xp+=Math.max(0,Math.floor(amount));let levels=0;while(profile.xp>=profile.level*30){profile.xp-=profile.level*30;profile.level++;levels++}if(levels){state.pendingLevelUps+=levels;rollAbilityChoices()}saveProfile();return levels}
function effectiveDamage(){return 4+profile.attackRank+state.runDamageBonus}
function effectiveMaxHp(){return 100+profile.vitalityRank*15}
function purchaseUpgrade(kind){const cfg={attack:{rank:"attackRank",base:30,step:20},vitality:{rank:"vitalityRank",base:35,step:20},claw:{rank:"clawRank",base:25,step:18}}[kind];if(!cfg)return false;const rank=profile[cfg.rank],cost=cfg.base+rank*cfg.step;if(profile.coins<cost)return false;profile.coins-=cost;profile[cfg.rank]++;state.coins=profile.coins;const oldMax=state.maxHp;state.damage=effectiveDamage();state.maxHp=effectiveMaxHp();if(kind==="vitality"&&state.started)state.hp=Math.min(state.maxHp,state.hp+state.maxHp-oldMax);saveProfile();beep(620,.08,"triangle");return true}
function planEnemyIntents(){
 const active=state.enemies.filter(e=>!e.dying&&e.hp>0);
 for(const e of active){
  const range=e.type==="boss"?178:e.type==="bat"?148:e.type==="goblin"?136:122;
  const close=e.x-state.playerX<=range;
  e.enraged=e.type==="boss"&&e.hp<=e.maxHp*.5;
  if(close&&state.turnNumber>=e.nextAttackTurn)e.intent="attack";
  else if(close)e.intent="brace";
  else e.intent="advance";
  e.spinesActive=e.type==="porcupine"&&e.intent==="brace";
  if(e.type==="goblin"&&e.intent==="brace"&&e.guard<=0)e.guard=3;
 }
}
function beginPlayerTurn(){
 if(state.over||state.stageCleared)return false;
 if(state.poisonTurns>0){state.hp=Math.max(0,state.hp-state.poisonDamage);state.poisonTurns--;popText("TRUCIZNA -"+state.poisonDamage,state.playerX,state.playerY-78,"#a8e77c");if(state.hp<=0){state.hp=0;state.over=true;state.turnPhase="over";profile.bestScore=Math.max(profile.bestScore,state.score);state.bestScore=profile.bestScore;profile.bestStage=Math.max(profile.bestStage,state.stage);saveProfile();return false}}
 if(state.runWard>0){const gain=state.runWard*2;state.shield=Math.min(40,state.shield+gain);popText("TARCZA +"+gain,state.playerX,state.playerY-82,"#9fc9ff")}
 state.turn="player";state.turnPhase="claw";state.clawUsedThisTurn=false;state.heroActionUsedThisTurn=false;
 state.defending=false;state.clawMode="idle";state.clawY=565;state.grabbed=null;
 state.clawX=clamp(225+rand(-55,55),58,392);state.machinePrizes=generateMachinePrizes();
 planEnemyIntents();state.skillReady=state.skillCooldownTurns<=0;
 notify("TURA "+state.turnNumber+" • USTAW I UŻYJ CHWYTAKA");
 return true;
}
function spawnStageWave(){
 const def=stageDefinition();if(state.stageWave>=def.waves.length){completeStage();return}
 const types=def.waves[state.stageWave++];state.wave=state.stageWave;state.enemies=[];state.selectedEnemy=0;state.threatEnemy=null;
 for(const type of types)spawnEnemy(type);
 beginPlayerTurn();notify("ETAP "+state.stage+" • FALA "+state.wave);
}
function completeStage(){
 if(state.stageCleared)return false;
 const def=stageDefinition();state.stageCleared=true;state.turnPhase="cleared";state.turn="player";
 state.stageReward=def.coins;state.stageXp=def.xp;gainCoins(def.coins);gainXp(def.xp);
 profile.unlockedStage=Math.max(profile.unlockedStage,state.stage+1);profile.bestStage=Math.max(profile.bestStage,state.stage);
 profile.bestScore=Math.max(profile.bestScore,state.score);state.bestScore=Math.max(state.bestScore,state.score);
 saveProfile();state.hp=Math.min(state.maxHp,state.hp+15);notify("ETAP UKOŃCZONY • NAGRODA ODEBRANA");return true;
}
function advanceStage(){
 if(!state.stageCleared)return false;
 state.stage++;state.stageWave=0;state.stageCleared=false;state.stageReward=0;state.stageXp=0;state.enemies=[];
 state.selectedEnemy=0;state.turn="player";state.turnPhase="claw";state.turnNumber=1;state.defending=false;
 state.damage=effectiveDamage();state.maxHp=effectiveMaxHp();state.hp=Math.min(state.maxHp,state.hp);spawnStageWave();return true;
}
function startRun(stage=profile.unlockedStage){
 state.clawUsedThisTurn=false;state.heroActionUsedThisTurn=false;state.guardTurns=0;
 state.skillCooldownTurns=0;
 state.weaponId="sidearm";state.weaponLevel=1;state.prizeRefreshTimer=0;state.machinePrizes=generateMachinePrizes();
 state.started=true;state.paused=false;state.over=false;state.screen="game";state.time=0;state.shot=0;state.poisonTurns=0;state.poisonDamage=2;
 state.turn="player";state.turnPhase="claw";state.turnNumber=1;state.defending=false;state.selectedEnemy=0;
 state.playerAction="idle";state.playerActionTimer=0;state.skillReady=true;
 state.stage=Math.max(1,Math.min(profile.unlockedStage,Math.floor(stage)||1));state.stageWave=0;state.stageCleared=false;state.stageReward=0;state.stageXp=0;
 state.runDamageBonus=0;state.runSkills={};state.runCrit=0;state.runSkillBonus=0;state.runHealOnKill=0;state.runClawBonus=0;state.runLootBonus=0;state.runVenom=0;state.runBleed=0;state.runWard=0;state.runCounterBonus=0;
 state.pendingLevelUps=0;state.levelChoices=null;state.wave=1;state.kills=0;state.score=0;state.coins=profile.coins;
 state.maxHp=effectiveMaxHp();state.hp=state.maxHp;state.damage=effectiveDamage();state.shield=0;state.playerX=86;
 state.enemies=[];state.bullets=[];state.particles=[];state.impacts=[];state.attackFx=null;state.shake=0;state.floaters=[];
 state.clawMode="idle";state.clawX=225;state.clawY=565;state.grabbed=null;state.playerY=408;state.bossSpawned=false;
 state.settingsOpen=false;state.helpOpen=false;state.upgradesOpen=false;spawnStageWave();notify("WYPRAWA ROZPOCZĘTA • TRYB TUROWY");return true;
}
let audio=null;
try{state.coins=profile.coins;state.bestScore=profile.bestScore;state.sound=localStorage.getItem("clawQuestSound")!=="false";state.effects=localStorage.getItem("clawQuestEffects")!=="false";state.bestScore=Number(localStorage.getItem("clawQuestBest")||0)||0}catch(e){}
function beep(freq=440,duration=.07,type="sine",volume=.035){
 if(!state.sound)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  const now=audio.currentTime;
  const voice=(hz,gain,shape,detune=0)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=shape;o.frequency.setValueAtTime(hz,now);o.detune.setValueAtTime(detune,now);g.gain.setValueAtTime(.001,now);g.gain.exponentialRampToValueAtTime(Math.max(.001,gain),now+.012);g.gain.exponentialRampToValueAtTime(.001,now+duration);o.connect(g);g.connect(audio.destination);o.start(now);o.stop(now+duration+.015)};
  voice(freq,volume,type);voice(freq*2,volume*.2,"sine",5);
 }catch(e){}
}
function rounded(x,y,w,h,r,fill,stroke,lw=1){
 ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}
}
function text(s,x,y,size=14,color="#fff",weight=800,align="left"){
 ctx.font=weight+" "+size+"px Inter,system-ui,sans-serif";ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillStyle=color;ctx.fillText(s,x,y);
}
function glow(x,y,r,color,alpha=.35){
 if(!state.effects)return;
 const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,"transparent");ctx.globalAlpha=alpha;ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
}
function line(x1,y1,x2,y2,color,width=2){

}
function pill(x,y,w,label,fill="#263a60",color="#fff"){

}
function button(x,y,w,h,label,sub,active=false){
 const top=active?"#c99a55":"#303b46",bottom=active?"#80552e":"#151d26",edge=active?"#e1bd7b":"#65717a";
 rounded(x,y+4,w,h,5,"#020508cc");
 const g=ctx.createLinearGradient(x,y,x,y+h);g.addColorStop(0,top);g.addColorStop(1,bottom);
 rounded(x,y,w,h,5,g,edge,1);
 ctx.fillStyle=active?"#f0d7a4":"#a8b1b5";ctx.fillRect(x+7,y+5,2,h-10);
 ctx.save();ctx.shadowColor=active?"#d29a4e55":"#00000088";ctx.shadowBlur=active?9:3;
 text(label,x+w/2,y+h*(sub?.39:.52),Math.min(13,w/Math.max(7,label.length*.62)),active?"#1c1710":"#e4e7e5",1000,"center");ctx.restore();
 if(sub)text(sub,x+w/2,y+h*.76,Math.min(8,w/Math.max(7,sub.length*.55)),active?"#5b4126":"#a2adb1",800,"center");
}
function drawBackground(){
 const def=stageDefinition(),palettes={
 meadow:{sky1:"#72b6bd",sky2:"#8dbb89",sky3:"#526f58",hill:"#56845a",tree:"#244d3b",tree2:"#376b4a",floor1:"#a29a66",floor2:"#5c7650",line:"#e2c47a"},
 forest:{sky1:"#4f9eaa",sky2:"#668d6b",sky3:"#294b42",hill:"#35674c",tree:"#173f34",tree2:"#285d45",floor1:"#8c915a",floor2:"#3d6144",line:"#c6b477"},
 cave:{sky1:"#627c94",sky2:"#40556c",sky3:"#1d2c3a",hill:"#39475b",tree:"#263648",tree2:"#3e5266",floor1:"#77766c",floor2:"#454d56",line:"#c5b08b"},
 ruins:{sky1:"#c38b65",sky2:"#8a6e5b",sky3:"#373d3e",hill:"#67584b",tree:"#343d38",tree2:"#5a5948",floor1:"#a18a61",floor2:"#5a5948",line:"#e2c18a"},

function generateMachinePrizes(){
 const weighted=["coin","coin","coin","xp","xp","gem","ammo","star","heart","bomb","weapon","weapon","skill"];
 const prizes=[],count=6+Math.floor(Math.random()*2),used=[];
 for(let i=0;i<count;i++){
  const type=pick(weighted),radius=13+Math.random()*5;
  let x=225;
  for(let attempt=0;attempt<24;attempt++){
   const candidate=48+Math.random()*354;
   if(used.every(v=>Math.abs(v-candidate)>34)){x=candidate;break}
  }
  used.push(x);
  prizes.push({id:"p"+Math.random().toString(36).slice(2),type,x,y:612+Math.random()*42,phase:Math.random()*6.28,radius,size:.82+Math.random()*.24});
 }
 if(!prizes.some(p=>p.type==="coin"))prizes[0].type="coin";
 if(!prizes.some(p=>p.type==="heart")&&state.hp<state.maxHp*.55)prizes[prizes.length-1].type="heart";
 return prizes;
}

 let remaining=finalDamage;if(target.guard>0){const absorbed=Math.min(target.guard,remaining);target.guard-=absorbed;remaining-=absorbed;if(absorbed)popText("PANCERZ -"+absorbed,target.x,target.y-55,"#9cddff")}if(remaining>0)target.hp-=remaining;target.hit=.28;state.score+=1;if(remaining>0&&state.runBleed>0){target.bleedTurns=Math.max(target.bleedTurns||0,2);target.bleedDamage=Math.max(target.bleedDamage||0,state.runBleed)}if(target.type==="porcupine"&&target.spinesActive&&target.lastThornsTurn!==state.turnNumber){target.lastThornsTurn=state.turnNumber;state.hp=Math.max(0,state.hp-2);popText("KOLCE -2",state.playerX,state.playerY-67,"#ffbd82");spawnImpact({x:state.playerX,y:state.playerY-25,type:"hero"},"incoming",2)}
 const kind=critical?"critical":weapon.id==="cannon"?"arcane":"slash";
 spawnImpact(target,kind,finalDamage);
 popText((critical?"KRYTYK ":"-")+finalDamage,target.x,target.y-45,critical?"#ff9b63":weapon.color);
}
function fireWeapon(counter=false){
 if(!canHeroAct())return false;
 const weapon=weaponForRun(),target=findCombatTarget();
 if(!target)return false;
 const base=currentWeaponDamage()+state.runVenom+(counter?state.runCounterBonus:0),active=state.enemies.filter(e=>!e.dying&&e.hp>0);
 const critical=Math.random()<state.runCrit;
 applyWeaponDamage(target,base,weapon,critical);
 if(weapon.id==="repeater")applyWeaponDamage(target,Math.ceil(base*.55),weapon,false);
 if(weapon.id==="scatter"){
  const extra=active.filter(e=>e!==target).sort((a,b)=>Math.abs(a.x-target.x)-Math.abs(b.x-target.x)).slice(0,2);
  for(const e of extra)applyWeaponDamage(e,Math.ceil(base*.62),weapon,false);
 }
 if(weapon.id==="cannon"){
  for(const e of active){if(e!==target&&Math.abs(e.x-target.x)<78)applyWeaponDamage(e,Math.ceil(base*.55),weapon,false)}
 }
 if(weapon.id==="laser"){
  const next=active.filter(e=>e!==target&&e.x>target.x).sort((a,b)=>a.x-b.x)[0];
  if(next)applyWeaponDamage(next,Math.ceil(base*.7),weapon,false);
 }
 state.attackFx={type:weapon.id,x1:state.playerX+28,y1:state.playerY-28,x2:target.x,y2:target.y-22,color:weapon.color,life:.28,max:.28};
 state.playerAction="attack";state.playerActionDuration=.24;state.playerActionTimer=.24;state.shot++;
 beep(weapon.id==="cannon"?150:weapon.id==="laser"?760:weapon.id==="repeater"?540:360,.09,weapon.id==="cannon"?"sawtooth":"square",.024);
 markDefeatedEnemies();return true;
}
function finishPlayerAction(action){
 state.heroActionUsedThisTurn=true;state.turn="enemy";state.turnPhase="enemy";
 state.playerAction=action;state.playerActionDuration=.32;state.playerActionTimer=.32;
 return resolveEnemyTurn();
}
function combatAttack(){
 if(!canHeroAct())return false;
 if(!findCombatTarget()){notify("BRAK CELU • AKCJA ZAMKNIĘTA");finishPlayerAction("attack");return true}
 if(!fireWeapon())return false;
 finishPlayerAction("attack");return true;
}
function shootVolley(){return combatAttack()}
function combatDefend(){
 if(!canHeroAct())return false;
 state.guardTurns=1;state.defending=true;popText("KONTRATAK + OSŁONA",state.playerX,state.playerY-70,"#a9e9ff");beep(260,.1,"triangle");
 fireWeapon(true);finishPlayerAction("counter");return true;
}
function combatSkill(){
 if(!canHeroAct()||state.skillCooldownTurns>0)return false;
 const active=state.enemies.filter(e=>!e.dying&&e.hp>0);
 if(!active.length){notify("BRAK CELU DLA UMIEJĘTNOŚCI");return false}
 const dmg=Math.ceil(state.damage*1.8+3+state.runSkillBonus);
 state.skillCooldownTurns=2;state.skillReady=false;
 state.playerAction="special";state.playerActionDuration=.52;state.playerActionTimer=.52;state.playerHit=.1;
 state.attackFx={type:"laser",x1:state.playerX+18,y1:state.playerY-30,x2:225,y2:355,color:"#bd9aff",life:.38,max:.38};
 for(const e of active){e.hp-=dmg;e.hit=.36;spawnImpact(e,"arcane",dmg);popText("SKILL -"+dmg,e.x,e.y-48,"#ffb8ff")}
 markDefeatedEnemies();notify("IMPULS OBSZAROWY • ODNAWIA SIĘ ZA 2 TURY");beep(880,.15,"sawtooth");
 finishPlayerAction("special");return true;
}
function applyEnemyHit(e){
 if(state.over||!e||e.dying||e.hp<=0)return 0;
 e.action="attack";e.actionDuration=.38;e.actionTimer=.38;
 const raw=e.type==="boss"?Math.ceil(e.damage/3)+(e.enraged?2:0):e.damage;
 const dmg=Math.max(1,Math.ceil(raw*(state.guardTurns>0?.5:1)));
 if(state.shield>0){const absorbed=Math.min(state.shield,dmg);state.shield-=absorbed;const left=dmg-absorbed;popText("TARCZA -"+absorbed,state.playerX,state.playerY-65,"#83f6e9");if(left>0)state.hp=Math.max(0,state.hp-left)}
 else state.hp=Math.max(0,state.hp-dmg);
 if(e.type==="slime"){state.poisonTurns=Math.max(state.poisonTurns,2);state.poisonDamage=2;popText("ZATRUCIE",state.playerX,state.playerY-90,"#baff88")}
 popText("-"+dmg,state.playerX,state.playerY-65,state.guardTurns>0?"#9fe9ff":"#ff8d9e");
 spawnImpact({x:state.playerX,y:state.playerY-25,type:"hero"},"incoming",dmg);
 state.playerHit=.2;state.playerAction=state.guardTurns>0?"defend":"hurt";state.playerActionDuration=.3;state.playerActionTimer=.3;
 beep(170,.12,"sawtooth");return dmg;
}
function resolveEnemyTurn(){
 if(state.turnPhase!=="enemy")return false;
 const active=state.enemies.filter(e=>!e.dying&&e.hp>0);
 for(const e of active){
  if(state.hp<=0)break;
  if(e.bleedTurns>0&&e.hp>0){const wound=e.bleedDamage||1;e.hp-=wound;e.bleedTurns--;popText("KRWAWIENIE -"+wound,e.x,e.y-64,"#ff8998");spawnImpact(e,"critical",wound)}
  if(e.hp<=0)continue;
  if(e.intent==="attack"&&state.turnNumber>=e.nextAttackTurn){
   if(e.type==="bat"){e.x=Math.max(state.playerX+66,e.x-18);e.action="dive"}
   else if(e.type==="boss")e.action="slam";
   applyEnemyHit(e);e.action=e.type==="bat"?"dive":e.type==="boss"?"slam":e.action;e.actionTimer=.36;e.actionDuration=.36;
   e.nextAttackTurn=state.turnNumber+(e.enraged?1:(e.attackEvery||1));
   if(e.type==="bat")e.x=Math.max(state.playerX+105,e.x+34);
  }else if(e.intent==="advance"){
   const step=e.approachStep||e.speed||28;e.x=Math.max(state.playerX+74,e.x-step);e.action="advance";e.actionTimer=.22;e.actionDuration=.22;
   const range=e.range||122;if(e.x-state.playerX<=range)e.nextAttackTurn=Math.min(e.nextAttackTurn,state.turnNumber+1);
  }else{e.action="idle";e.nextAttackTurn=Math.min(e.nextAttackTurn,state.turnNumber+1)}
 }
 if(state.guardTurns>0)state.guardTurns--;state.defending=false;
 if(state.skillCooldownTurns>0)state.skillCooldownTurns--;state.skillReady=state.skillCooldownTurns<=0;
 markDefeatedEnemies();
 if(state.hp<=0){state.hp=0;state.over=true;state.turnPhase="over";profile.bestScore=Math.max(profile.bestScore,state.score);state.bestScore=profile.bestScore;profile.bestStage=Math.max(profile.bestStage,state.stage);saveProfile();return true}
 if(!state.enemies.some(e=>!e.dying&&e.hp>0)){state.turnPhase="transition";state.turn="enemy";return checkEncounterClear()}
 state.turnNumber++;beginPlayerTurn();return true;
}
function checkEncounterClear(){
 if(state.enemies.some(e=>!e.dying&&e.hp>0))return false;
 if(state.enemies.some(e=>e.dying&&e.deathTimer>0)){state.turnPhase="transition";return false}
 state.enemies=[];
 if(state.stageWave<stageDefinition().waves.length)spawnStageWave();else completeStage();
 return true;
}
function updateCharacterAnimations(dt){
 if(state.playerActionTimer>0){state.playerActionTimer=Math.max(0,state.playerActionTimer-dt);if(state.playerActionTimer===0)state.playerAction="idle"}
 for(const e of state.enemies){
  e.phase+=dt*2;
  if(e.hit>0)e.hit=Math.max(0,e.hit-dt);
  if(e.actionTimer>0){e.actionTimer=Math.max(0,e.actionTimer-dt);if(e.actionTimer===0)e.action="idle"}
  if(e.dying&&e.deathTimer>0)e.deathTimer=Math.max(0,e.deathTimer-dt);
 }
 if(state.attackFx){state.attackFx.life=Math.max(0,state.attackFx.life-dt);if(state.attackFx.life<=0)state.attackFx=null}
}
function deployClaw(){
 if(!state.started||state.over||state.paused||state.turnPhase!=="claw"||state.clawUsedThisTurn||state.clawMode!=="idle")return false;
 state.clawUsedThisTurn=true;state.clawMode="down";state.grabbed=null;beep(310,.08,"triangle");return true;
}
function moveClaw(dir){
 if(state.turnPhase==="claw"&&!state.clawUsedThisTurn&&state.clawMode==="idle"){
  state.clawX=clamp(state.clawX+dir*23,54,396);beep(230,.03,"square",.015);
 }
}
function notify(msg){toastEl.textContent=msg;toastEl.classList.add("show");state.toastTimer=1.35}
function reset(){return startRun(profile.unlockedStage)}
function interact(x,y){
 if(state.levelChoices){if(y>=270&&y<=600){const index=clamp(Math.floor((y-270)/108),0,2);chooseAbility(index)}return}
 if(state.settingsOpen){if(y>=345&&y<=400&&x>=270){state.sound=!state.sound;try{localStorage.setItem("clawQuestSound",String(state.sound))}catch(e){}beep(520,.05);return}if(y>=415&&y<=480&&x>=270){state.effects=!state.effects;try{localStorage.setItem("clawQuestEffects",String(state.effects))}catch(e){}beep(420,.05);return}if(y>=500&&y<=565){state.settingsOpen=false;return}return}
 if(state.upgradesOpen){if(y>=309&&y<=365&&x>=270){purchaseUpgrade("attack");return}if(y>=391&&y<=447&&x>=270){purchaseUpgrade("vitality");return}if(y>=473&&y<=529&&x>=270){purchaseUpgrade("claw");return}if(y>=555&&y<=605){state.upgradesOpen=false;return}return}
 if(state.helpOpen){if(y>=574&&y<=610){state.helpOpen=false;return}return}
 if(state.screen==="title"){if(y>=665&&y<=720){startRun(profile.unlockedStage);return}if(y>=720&&y<=770){if(x<160)state.upgradesOpen=true;else if(x<285)state.settingsOpen=true;else state.helpOpen=true;return}return}
 if(state.over){if(y>430&&y<510)reset();return}
 if(state.stageCleared){if(y>=435&&y<=505){advanceStage();return}return}
 if(state.paused){if(y>=365&&y<=420){state.paused=false;return}if(y>=425&&y<=480){state.settingsOpen=true;return}if(y>=480&&y<=540){state.paused=false;state.started=false;state.over=false;state.screen="title";state.enemies=[];state.particles=[];state.impacts=[];state.floaters=[];return}return}
 if(y<60&&x>400){state.paused=true;return}if(y<60&&x>365){state.sound=!state.sound;try{localStorage.setItem("clawQuestSound",String(state.sound))}catch(e){}beep(520,.05);return}
 if(y>=450&&y<=495){if(x<146)combatAttack();else if(x<276)combatDefend();else combatSkill();return}
 if(y>=680&&y<=735){if(x<85)moveClaw(-1);else if(x<150)moveClaw(1);else if(x>285)deployClaw();return}
 if(y>=500&&y<675){if(state.turnPhase==="claw"&&state.clawMode==="idle")state.clawX=clamp(x,54,396);return}
 if(y>140&&y<420){
  let near=-1,best=1e9;state.enemies.forEach((en,i)=>{if(en.dying||en.hp<=0)return;const d=Math.hypot(en.x-x,(en.y-18)-y);if(d<best){best=d;near=i}});
  if(near>=0&&best<90){state.selectedEnemy=near;notify("CEL: "+enemyName(state.enemies[near]))}
 }
}

let pointerStart=null;
canvas.addEventListener("pointerdown",e=>{
 const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
 pointerStart={x,y,id:e.pointerId};canvas.setPointerCapture(e.pointerId);interact(x,y);
});
canvas.addEventListener("pointermove",e=>{
 if(!pointerStart)return;
 const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width;
 if(pointerStart.y>500&&pointerStart.y<675&&state.turnPhase==="claw"&&!state.clawUsedThisTurn&&state.clawMode==="idle")state.clawX=clamp(x,54,396);
});
const clearPointer=()=>{pointerStart=null};
canvas.addEventListener("pointerup",clearPointer);
canvas.addEventListener("pointercancel",clearPointer);
canvas.addEventListener("lostpointercapture",clearPointer);
window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight"," ","a","d","A","D","f","F","Escape","Enter"].includes(e.key))e.preventDefault();
 if(e.key==="Escape"){
  if(state.settingsOpen){state.settingsOpen=false;return}
  if(state.helpOpen){state.helpOpen=false;return}
  if(state.upgradesOpen){state.upgradesOpen=false;return}
   if(state.screen==="game"&&!state.over)state.paused=!state.paused;
  return;
 }
 if(state.screen==="title"){
  if(e.key==="Enter"&&!state.settingsOpen&&!state.helpOpen)reset();
  return;
 }
 if(state.settingsOpen||state.helpOpen||state.paused||state.over)return;
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")moveClaw(-1);
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")moveClaw(1);
 if(e.key===" "||e.key.toLowerCase()==="f")deployClaw();
 if(e.key.toLowerCase()==="j")combatAttack();if(e.key.toLowerCase()==="k")combatDefend();if(e.key.toLowerCase()==="l")combatSkill();
});
function update(dt){
 state.time+=Math.max(0,dt);
 if(state.toastTimer>0){state.toastTimer-=dt;if(state.toastTimer<=0)toastEl.classList.remove("show")}
 if(state.screen!=="game"||state.paused||state.over||state.stageCleared||state.levelChoices)return;
 updateCharacterAnimations(dt);
 
 const remaining=[];
 for(const b of state.bullets){b.life-=dt;if(b.life>0)remaining.push(b)}
 state.bullets=remaining;
 for(const p of state.particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=120*dt;p.life-=dt}
 state.particles=state.particles.filter(p=>p.life>0);if(!state.effects)state.particles=[];
 for(const fx of state.impacts)fx.life-=dt;state.impacts=state.impacts.filter(fx=>fx.life>0);state.shake=Math.max(0,state.shake-dt*18);
 for(const f of state.floaters){f.y-=22*dt;f.life-=dt}state.floaters=state.floaters.filter(f=>f.life>0);
 if(state.clawMode==="down"){
  state.clawY=Math.min(676,state.clawY+430*dt);
  if(state.clawY>=676){
   const nearest=state.machinePrizes.reduce((best,p)=>{
    if(!best)return p;const d=Math.hypot(p.x-state.clawX,p.y-660),bd=Math.hypot(best.x-state.clawX,best.y-660);return d<bd?p:best;
   },null);
   const tolerance=nearest?(nearest.radius||15)+34+profile.clawRank*2+state.runClawBonus:0;
   if(nearest&&Math.hypot(nearest.x-state.clawX,nearest.y-660)<=tolerance){
    state.grabbed=nearest;state.machinePrizes=state.machinePrizes.filter(p=>p.id!==nearest.id);
    notify("ZŁAPANO KULĘ • "+nearest.type.toUpperCase());beep(760,.12,"triangle");
   }else{state.grabbed=null;notify("PUSTY CHWYT • CELOWANIE MA ZNACZENIE");beep(180,.12,"triangle")}
   state.clawMode="return";
  }
 }else if(state.clawMode==="return"){
  state.clawY=Math.max(565,state.clawY-520*dt);
  if(state.clawY<=565){
   state.clawMode="idle";if(state.grabbed)reward(state.grabbed.type);state.grabbed=null;
   state.turnPhase="hero";state.turn="player";notify("FAZA 2/2 • WYKONAJ JEDNĄ AKCJĘ");
  }
 }
 for(const star of state.stars){star.y+=star.v*dt;if(star.y>500)star.y=85}
 state.enemies=state.enemies.filter(e=>!e.dying||e.deathTimer>0);
 if(state.turnPhase==="transition"&&state.enemies.length===0)checkEncounterClear();
}
function frame(ts){
 const dt=Math.min(.033,(ts-state.last)/1000||0);state.last=ts;
 update(dt);draw();requestAnimationFrame(frame);
}
for(let i=0;i<30;i++)state.stars.push({x:rand(5,W-5),y:rand(90,490),r:rand(.6,1.8),a:rand(.15,.55),v:rand(4,16)});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state.screen==="game")state.paused=true});
if(window.location?.search?.includes("test=1"))window.__CLAW_TEST_API__={state,profile,stageCatalog,abilityPool,weaponCatalog,weaponForRun,currentWeaponDamage,startRun,reset,spawnEnemy,spawnStageWave,completeStage,advanceStage,purchaseUpgrade,saveProfile,loadProfile,gainCoins,gainXp,rollAbilityChoices,chooseAbility,combatAttack,combatDefend,combatSkill,resolveEnemyTurn,reward,moveHero,moveHeroTo,fireWeapon,findCombatTarget,applyEnemyHit,moveClaw,deployClaw,interact,update,stageDefinition,beginPlayerTurn,planEnemyIntents,markDefeatedEnemies,checkEncounterClear,canHeroAct};
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
draw();requestAnimationFrame(frame);
})();
